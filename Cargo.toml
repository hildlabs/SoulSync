[workspace]
resolver = "2"
members = ["crates/soulsync-core", "crates/soulsync-cli", "crates/soulsync-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/hildlabs/SoulSync"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
