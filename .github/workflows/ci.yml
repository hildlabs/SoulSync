name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # The desktop app for Windows, to download from the run's summary page.
  # Builds of main are also published as a release, which is where the app
  # looks for updates; see crates/soulsync-app/src/update.rs.
  windows-app:
    runs-on: windows-latest
    # One build of main at a time, so releases come out in order.
    concurrency:
      group: windows-app-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SOULSYNC_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p soulsync-app
      # The release below is what the app installs; do not let a failing
      # artifact upload hold it back.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SoulSync-windows
          path: target/release/SoulSync.exe
          if-no-files-found: error
      - name: Publish the build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" target/release/SoulSync.exe
          --target "${{ github.sha }}" --title "Build ${{ github.run_number }}"
          --notes "SoulSync for Windows, built from ${{ github.sha }}. The app installs this by itself."
          --latest
