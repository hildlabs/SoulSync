# A public SoulSync run server.
#
# With HTTPS from the bundled Caddy (ports 80 and 443 must be free and open,
# and the domain must point to this machine):
#
#   SOULSYNC_DOMAIN=soulsync.example.org docker compose --profile https up -d --build
#
# If another program holds port 80 or 443 on one of the machine's addresses
# (Tailscale does, on its own interface), set SOULSYNC_BIND to the public
# address so Caddy only listens there. Put the variables in a `.env` file next
# to this one to keep them across restarts.
#
# Set SOULSYNC_EMAIL to your address to let Caddy fall back to ZeroSSL when
# Let's Encrypt refuses. That happens on host names many people share, such as
# the ones hosting providers hand out, because Let's Encrypt limits
# certificates per domain.
#
# Without HTTPS, for a quick test: SOULSYNC_DOMAIN=:80 serves plain HTTP on
# the machine's address.
#
# Behind a reverse proxy you already run: start only the server and point the
# proxy at 127.0.0.1:3000 (it must pass WebSocket upgrades through):
#
#   docker compose up -d --build
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SOULSYNC_PORT:-3000}:3000"
    # Runs survive updates and restarts here.
    volumes:
      - runs:/data

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${SOULSYNC_BIND:-0.0.0.0}:80:80"
      - "${SOULSYNC_BIND:-0.0.0.0}:443:443"
    environment:
      SOULSYNC_DOMAIN: ${SOULSYNC_DOMAIN:-localhost}
      SOULSYNC_ACME: ${SOULSYNC_EMAIL:+email ${SOULSYNC_EMAIL}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
  runs:
