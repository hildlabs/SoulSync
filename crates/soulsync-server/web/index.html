<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoulSync</title>
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<style>
@font-face{font-family:Geist;src:url(/assets/fonts/Geist.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(/assets/fonts/GeistMono.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Jersey 10";src:url(/assets/fonts/Jersey10.woff2) format("woff2");font-weight:400;font-display:swap}

/* ===== tokens (docs/design.md). Dark first, light below. Components use only these. */
:root{
  color-scheme:dark;
  --night:#0B0B15;--glass:rgba(20,19,36,.62);--glass-hi:rgba(34,31,58,.72);
  --ovc:255,255,255;--ov-0:rgba(var(--ovc),.02);--ov-1:rgba(var(--ovc),.045);--ov-2:rgba(var(--ovc),.08);--ov-3:rgba(var(--ovc),.12);
  --edge:rgba(var(--ovc),.08);--edge-hi:rgba(var(--ovc),.16);
  --text:#F1EEF8;--muted:#A7A2BD;--faint:#77728E;
  --a:#FF8D4D;--b:#56C2F0;--p3:#B79CFF;--p4:#EBC34A;--ok:#5FD38D;--danger:#F2617A;--warn:#F2B544;--up:#5FD38D;--dn:#F2617A;
  --solid:#14131F;--pillbg:#1D1B2F;--ring-in:#151424;--toast:#1D1B2E;--dlg-bg:rgba(20,19,36,.94);--tymix:#FFFFFF;--inverse:#F1EEF8;--inverse-text:#0B0B15;
  --shade:11,11,21;--sky1:#090B14;--sky2:#141530;--sky3:#2A1C3F;--sky4:#4A2440;--hill1:#231A36;--hill2:#18142A;--hill3:#0F0E1B;--ground:#0B0B15;--moon:#CFEFFF;--stars:1;
  --sans:Geist,ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--pix:"Jersey 10",Geist,sans-serif;
  --r-sm:9px;--r-md:13px;--r-lg:18px;
  --out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --line:var(--edge);--raised:var(--ov-2);--surface:var(--solid);--band:var(--ov-1);
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  color-scheme:light;--night:#E9ECF5;--glass:rgba(255,255,255,.74);--glass-hi:rgba(255,255,255,.95);
  --ovc:40,32,80;--edge:rgba(40,32,80,.1);--edge-hi:rgba(40,32,80,.2);
  --text:#1B1830;--muted:#57536F;--faint:#8C88A3;
  --a:#E8681F;--b:#1A8CC6;--p3:#6A4BD1;--p4:#9A7400;--ok:#1C9A55;--danger:#D23655;--warn:#B87800;--up:#1C9A55;--dn:#D23655;
  --solid:#FFFFFF;--pillbg:#FFFFFF;--ring-in:#FFFFFF;--toast:#FFFFFF;--dlg-bg:rgba(250,250,253,.97);--tymix:#000000;--inverse:#1B1830;--inverse-text:#FFFFFF;
  --shade:233,236,245;--sky1:#8DBDEB;--sky2:#B9D5F2;--sky3:#F3D3C4;--sky4:#F6B796;--hill1:#B8B0D8;--hill2:#9A92C6;--hill3:#7B74AA;--ground:#6F689C;--moon:#FFF4CC;--stars:0;
}}
:root[data-theme=light]{
  color-scheme:light;--night:#E9ECF5;--glass:rgba(255,255,255,.74);--glass-hi:rgba(255,255,255,.95);
  --ovc:40,32,80;--edge:rgba(40,32,80,.1);--edge-hi:rgba(40,32,80,.2);
  --text:#1B1830;--muted:#57536F;--faint:#8C88A3;
  --a:#E8681F;--b:#1A8CC6;--p3:#6A4BD1;--p4:#9A7400;--ok:#1C9A55;--danger:#D23655;--warn:#B87800;--up:#1C9A55;--dn:#D23655;
  --solid:#FFFFFF;--pillbg:#FFFFFF;--ring-in:#FFFFFF;--toast:#FFFFFF;--dlg-bg:rgba(250,250,253,.97);--tymix:#000000;--inverse:#1B1830;--inverse-text:#FFFFFF;
  --shade:233,236,245;--sky1:#8DBDEB;--sky2:#B9D5F2;--sky3:#F3D3C4;--sky4:#F6B796;--hill1:#B8B0D8;--hill2:#9A92C6;--hill3:#7B74AA;--ground:#6F689C;--moon:#FFF4CC;--stars:0;
}

/* ===== base */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p,ol,ul{margin:0;padding:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:active{transform:scale(.97)}
::selection{background:var(--b);color:var(--night)}
:focus-visible{outline:2px solid var(--b);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-weight:500}
.pix{font-family:var(--pix);font-weight:400}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:var(--edge-hi) transparent}

/* ===== scene: own pixel night, parallax, embers */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bgsvg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px)}
#bgsvg .px{transition:transform .9s var(--out)}
#bgsvg .st0{animation:tw 3.2s ease-in-out infinite}
#bgsvg .st1{animation:tw 4.6s ease-in-out infinite 1.2s}
#bgsvg .flow{fill:none;stroke-linecap:round;stroke-dasharray:60 1900;animation:flow 7s linear infinite;opacity:.9}
#bgsvg .fb{animation-delay:-3.5s}
#bgsvg #sky stop:nth-child(1){stop-color:var(--sky1)}#bgsvg #sky stop:nth-child(2){stop-color:var(--sky2)}#bgsvg #sky stop:nth-child(3){stop-color:var(--sky3)}#bgsvg #sky stop:nth-child(4){stop-color:var(--sky4)}
#bgsvg [fill="#231A36"]{fill:var(--hill1)}#bgsvg [fill="#18142A"]{fill:var(--hill2)}#bgsvg [fill="#0F0E1B"]{fill:var(--hill3)}#bgsvg [fill="#0B0B15"]{fill:var(--ground)}
#bgsvg #moon{fill:var(--moon)}#bgsvg #stars{opacity:var(--stars);transition:opacity .6s}
#bgsvg #sky stop,#bgsvg path,#bgsvg rect{transition:fill .6s,stop-color .6s}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(var(--shade),.86) 0,rgba(var(--shade),.35) 30%,rgba(var(--shade),.1) 60%,rgba(var(--shade),.45) 100%),linear-gradient(0deg,rgba(var(--shade),.9) 0,rgba(var(--shade),0) 45%)}
#embers{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ===== shell: sidebar + main */
#app{position:relative;z-index:2;height:100%}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);gap:14px;height:100%;padding:14px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-lg);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.sbar{display:flex;flex-direction:column;padding:14px 10px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-size:16px;font-weight:700;letter-spacing:-.01em;color:inherit;text-decoration:none}
.mark{flex:none;width:22px;height:26px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px;color:var(--faint);font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.srun{position:relative;display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:var(--r-md);transition:background .25s,border-color .25s,transform .25s var(--out)}
.srun:hover{background:var(--ov-1);transform:translateX(2px)}
.srun:active{transform:translateX(2px) scale(.98)}
.srun.on{background:var(--glass-hi);border-color:var(--edge-hi)}
.srun.on::before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:3px;border-radius:3px;background:linear-gradient(var(--a),var(--b))}
.srun .ico{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--solid);border:1px solid var(--edge);overflow:hidden}
.srun .ico svg{width:20px;height:22px}
.srun span{min-width:0}
.srun b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srun small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srun.busy{opacity:.6;pointer-events:none}
.sbar .grow{flex:1;min-height:12px}
.sbar .err{padding:4px 10px}
.newrun{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 4px;padding:11px;border-radius:var(--r-md);border:1px dashed var(--edge-hi);background:var(--ov-0);font-weight:600;transition:all .25s var(--out)}
.newrun:hover{border-style:solid;border-color:var(--a);background:color-mix(in srgb,var(--a) 9%,transparent)}
.newrun.arm{border-style:solid;border-color:var(--danger);color:var(--danger)}
.slinks a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px}
.slinks a:hover{background:var(--ov-1);color:var(--text)}
.ver{padding:8px 10px 2px;color:var(--faint);font-size:11.5px}

.main{display:flex;flex-direction:column;gap:18px;min-width:0;min-height:0}
.top{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
.tabbar{position:relative;display:flex;gap:2px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabbar button{position:relative;z-index:1;padding:8px 14px;border-radius:12px;color:var(--muted);font-weight:500;white-space:nowrap;transition:color .2s}
.tabbar button:hover{color:var(--text)}
.tabbar button[aria-current=page]{color:var(--text)}
.tabbar button em{font-style:normal;color:var(--faint);margin-left:5px;font-size:12px}
.tabbar .pill{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:12px;background:var(--ov-3);transition:left .45s var(--spring),width .45s var(--spring)}
.chip{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;font-weight:500;white-space:nowrap;transition:border-color .2s,transform .2s var(--out)}
.chip:hover{border-color:var(--edge-hi)}
.chip button{color:var(--muted);font-weight:500;transition:color .15s}
.chip button:hover{color:var(--text)}
.chip .mono{font-size:12.5px;letter-spacing:.02em}
.chip.upd{border-color:color-mix(in srgb,var(--a) 45%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--a) 18%,var(--glass)),color-mix(in srgb,var(--b) 12%,var(--glass)))}
.chip.upd::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--a) 0 var(--pct,72%),var(--ov-3) 0)}
.chip.upd button{color:var(--a);font-weight:600}
.chip.upd.bad{border-color:var(--danger);color:var(--danger)}
.chip.upd.busy.wait::before{animation:turn 1s linear infinite}
.pair{display:flex;height:38px;padding:4px;border:1px solid var(--edge);border-radius:var(--r-md);background:var(--glass);backdrop-filter:blur(14px)}
.pair button{padding:0 9px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);transition:color .15s,background .15s}
.pair button[aria-pressed=true]{background:var(--ov-3);color:var(--text)}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(14px);color:var(--muted);transition:color .2s,border-color .2s,transform .3s var(--out)}
.icon-btn:hover{color:var(--text);border-color:var(--edge-hi);transform:translateY(-1px)}
.icon-btn[aria-current=page]{color:var(--text);border-color:var(--edge-hi);background:var(--glass-hi)}
.icon-btn .ic-sun{display:none}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .icon-btn .ic-sun{display:block}:root:not([data-theme=dark]) .icon-btn .ic-moon{display:none}}
:root[data-theme=light] .icon-btn .ic-sun{display:block}:root[data-theme=light] .icon-btn .ic-moon{display:none}
#gear:hover svg{transform:rotate(60deg)}#gear svg{transition:transform .5s var(--out)}
.avatars{display:flex;align-items:center;height:38px;padding:0 8px 0 6px;border-radius:var(--r-md);border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(14px)}
.av{position:relative;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#120F1E;background:var(--c);border:2px solid var(--solid);transition:opacity .3s,filter .3s}
.av+.av{margin-left:-5px}
.av.off{filter:grayscale(.8);opacity:.55}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 4px}
.status i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--faint);transition:background .3s}
.status.live i{background:var(--ok)}
.status.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);animation:ping 2.4s var(--out) infinite}
.status.bad i{background:var(--danger)}

/* ===== run page */
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.scroll{flex:1;min-height:0;overflow-y:auto}
.vhead{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:2px 6px 0}
.vhead h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.vhead p{margin-top:6px;color:var(--muted)}
.sum{font-size:14px;color:var(--muted);white-space:pre-wrap}
.sum b{font-weight:600;color:var(--text)}
.sum .bad{color:var(--danger)}

/* hero */
.hero{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:6px 6px 0}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:var(--r-sm);background:var(--ov-2);border:1px solid var(--edge);font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.tag.hl{color:var(--text);background:var(--ov-3)}
.tag .mono{font-size:12px}
.hero h1{font-size:clamp(40px,5vw,72px);line-height:1;letter-spacing:-.035em;font-weight:800}
:root[data-theme=light] .hero h1 span{background-image:linear-gradient(90deg,var(--a),#C2410C 45%,#0369A1 55%,var(--b))}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .hero h1 span{background-image:linear-gradient(90deg,var(--a),#C2410C 45%,#0369A1 55%,var(--b))}}
.hero h1 span{background:linear-gradient(90deg,var(--a),#FFC6A3 45%,#BDEBFF 55%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 6s ease-in-out infinite alternate}
.hero .sum{margin-top:12px;font-size:15px}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.play{position:relative;display:flex;align-items:center;gap:12px;padding:0 26px;height:58px;border-radius:16px;font-size:18px;font-weight:700;color:#fff;text-align:left;background:linear-gradient(100deg,#FF7A35,#FF9A5C 48%,#4FB6E8 52%,#2E9BD6);background-size:220% 100%;box-shadow:0 10px 40px -10px color-mix(in srgb,var(--a) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:background-position .7s var(--out),transform .25s var(--spring),box-shadow .4s;overflow:hidden}
.play:hover{background-position:100% 0;transform:translateY(-2px) scale(1.02);box-shadow:0 14px 50px -10px color-mix(in srgb,var(--b) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.play:active{transform:scale(.98)}
.play:disabled{filter:saturate(.4);opacity:.7;cursor:default;transform:none}
.play svg{flex:none;width:20px;height:20px}
.play small{display:block;font-size:11.5px;font-weight:500;opacity:.85;margin-top:-2px}
.play::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:250% 100%;animation:shine 3.8s ease-in-out infinite;pointer-events:none}
.play.full{width:100%;justify-content:center}
.sq{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(14px);color:var(--muted);transition:all .25s var(--out)}
.sq:hover{color:var(--text);border-color:var(--edge-hi);transform:translateY(-2px)}
.sq svg{width:22px;height:22px}
.sq.retry:hover svg{animation:spin .7s var(--out)}
.sq .tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translate(-50%,4px);white-space:nowrap;padding:5px 9px;border-radius:8px;background:var(--toast);border:1px solid var(--edge);font-size:12px;font-weight:500;color:var(--text);opacity:0;pointer-events:none;transition:all .2s var(--out);z-index:5}
.sq:hover .tip,.sq:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
.orden{min-width:300px;padding:16px 18px}
.orden h4{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.orden h4 b{font:400 22px var(--pix);color:var(--text);letter-spacing:0}
.orow{display:grid;grid-template-columns:62px repeat(8,minmax(14px,26px));justify-content:start;gap:6px;align-items:center;margin-top:6px}
.orow>span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.orow>span i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.badge{aspect-ratio:1;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:var(--ov-2);min-width:14px}
.badge.on{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#0B0B15));box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.badge.pop{animation:pop .6s var(--spring) both}
.capbar{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.capbar .bar{flex:1;height:8px;border-radius:4px;background:var(--ov-2);overflow:hidden}
.capbar .bar i{display:block;height:100%;width:var(--w,0%);background:repeating-linear-gradient(90deg,var(--ok) 0 6px,color-mix(in srgb,var(--ok) 75%,#000) 6px 8px);border-radius:4px;transition:width 1s var(--out)}
.capbar .bar i.over{background:var(--danger)}
.capbar b{font:400 22px var(--pix);color:var(--text)}

/* home panel: live | links | feed */
.hpanel{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,.8fr);grid-template-areas:"live links feed";overflow:hidden}
.col{min-height:0;overflow:auto;padding:18px;border-right:1px solid var(--edge)}
.col:last-child{border-right:0}
.col.live{grid-area:live}.col.links{grid-area:links}.col.feedc{grid-area:feed}
.col>h3,.card>h3{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:14px;font-weight:600}
.col>h3 em,.card>h3 em{font-style:normal;color:var(--faint);font-weight:500}
.col>h3 small,.card>h3 small{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.reveal{animation:rise .7s var(--out) backwards;animation-delay:calc(var(--i,0)*70ms + 80ms)}

/* live cards, one per player */
.pcard{position:relative;padding:14px 16px 16px;border-radius:16px;margin-bottom:12px;background:var(--ov-0);border:1px solid var(--edge);transition:background .4s,border-color .4s}
.pcard.fight{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,transparent),var(--ov-0) 60%);border-color:color-mix(in srgb,var(--c) 30%,transparent)}
.pcard.off{opacity:.7}
.pch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.pch>i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.pch b{color:var(--text);font-weight:600}
.pch .where{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:7px;background:var(--ov-2);font-size:11.5px;font-weight:600;color:var(--text)}
.state.fight{background:color-mix(in srgb,var(--danger) 18%,transparent);color:color-mix(in srgb,var(--danger) 60%,var(--tymix))}
.state.fight::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--danger);animation:blink 1s steps(2) infinite}
.state.away{color:var(--faint)}
.pcard .meta{margin-top:4px;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .idle{margin-top:10px;font-size:12.5px;color:var(--muted)}
.wild2{display:grid;grid-template-columns:84px minmax(0,1fr) 84px;gap:12px;align-items:center;margin-top:12px}
.stage{position:relative;width:84px;height:84px;display:grid;place-items:center}
.stage::before{content:"";position:absolute;bottom:8px;left:6px;right:6px;height:18px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 45%,transparent),transparent);animation:pulse 3s ease-in-out infinite}
.stage img{position:relative;width:96px;height:96px;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite}
.wnm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wnm b{font-size:16px;font-weight:700}
.wnm span{color:var(--muted);font-size:12.5px}
.wild2 .tys{margin:6px 0 10px}
.hpl{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.hpl .bar{flex:1;height:7px;border-radius:4px;background:var(--ov-2);overflow:hidden}
.hpl .bar i{display:block;height:100%;width:var(--w);background:var(--hc,var(--ok));transition:width .8s var(--out),background .4s}
.ail{padding:1px 6px;border-radius:5px;background:#E3C344;color:#2A2205;font-weight:700;font-size:10.5px;text-transform:uppercase}
.ring{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--ov-2) 0);transition:background .6s}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--ring-in)}
.ring div{position:relative;text-align:center;line-height:1}
.ring b{display:block;font:400 30px var(--pix)}
.ring small{font-size:10px;color:var(--muted)}
.balls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
.balls span{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:6px 9px;border-radius:var(--r-sm);background:var(--ov-1);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.balls span b{font:400 17px var(--pix);color:var(--text)}
.balls span.best{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--text)}

/* catch calculator */
.calc{margin-top:4px;padding:14px 16px 16px;border-radius:16px;background:var(--ov-0);border:1px solid var(--edge);position:relative}
.calc h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;font-weight:600}
.calc h2 small{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cin{width:100%;height:38px;margin-top:12px;padding:0 12px;border:1px solid var(--edge);border-radius:11px;background:var(--ov-1);outline:0;transition:border-color .15s}
.cin:focus{border-color:var(--edge-hi)}
.cin::placeholder{color:var(--faint)}
.clist{position:absolute;z-index:5;left:16px;right:16px;margin-top:4px;padding:4px;border:1px solid var(--edge-hi);border-radius:12px;background:var(--toast);box-shadow:0 12px 32px rgba(0,0,0,.28)}
.clist button{display:flex;justify-content:space-between;width:100%;padding:6px 8px;border-radius:8px;text-align:left}
.clist button small{color:var(--muted)}
.clist button.cur,.clist button:hover{background:var(--ov-2)}
.crow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.crow>span:first-child{flex:none;width:44px}
.crow input[type=range]{flex:1;min-width:0;height:18px;margin:0;accent-color:var(--hpc,var(--ok))}
.crow output{flex:none;width:40px;text-align:right;color:var(--text);font:400 17px var(--pix)}
.crow label{display:flex;align-items:center;gap:8px;cursor:pointer}
.seg3{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:11px;background:var(--ov-2)}
.seg3 button{height:26px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg3 button[aria-pressed=true]{background:var(--ov-3);color:var(--text);box-shadow:0 1px 0 var(--edge)}
.cres{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;font-size:12.5px}
.cres span small{color:var(--faint);margin-left:6px}
.cres b{font:400 18px var(--pix);text-align:right}
.cres u{grid-column:1/-1;height:4px;margin-bottom:4px;border-radius:2px;background:var(--ov-2);text-decoration:none;overflow:hidden}
.cres u i{display:block;height:100%;border-radius:2px;background:var(--ok);transition:width .45s var(--out),background .3s}
.cres.off{opacity:.35}
.clive{display:flex;align-items:center;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--ov-2);font-size:12.5px;min-width:0}
.clive span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clive small{margin-left:auto;padding-left:10px;color:var(--muted)}
.dot{display:inline-block;flex:none;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--faint)}
.dot.live{background:var(--ok);animation:ring 2s infinite}
.dot.error{background:var(--danger)}.dot.connecting,.dot.waiting{background:var(--warn)}

/* links: sections, rows, tiles */
.sec{margin-bottom:6px}
.sec h3{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sec:first-of-type h3{margin-top:0}
.sec h3 em{font-style:normal;color:var(--faint)}
.sec h3 small{margin-left:auto;font-size:11.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec[data-sec=lost] h3 span{color:var(--danger)}
.glyph{display:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r-md);transition:background .2s}
.row:hover{background:var(--ov-1)}
.row.enter{animation:rise .5s var(--out) backwards;animation-delay:calc(var(--i,0)*40ms)}
.row.leaving{transition:opacity .35s var(--out) .9s;opacity:0}
.side{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.side.b{flex-direction:row-reverse}
.side.swap>*{animation:fade .35s var(--out) backwards}
.idg{display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}
.side.b .idg{flex-direction:row-reverse;margin-left:0;margin-right:auto}
.names{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.side.b .names{align-items:flex-start}
.names b{display:block;max-width:100%;font-size:13.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s}
.tys{display:flex;gap:3px;flex-wrap:nowrap}
.ty{padding:1px 6px;border-radius:6px;font-size:10.5px;line-height:16px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--tc) 30%,transparent);color:color-mix(in srgb,var(--tc) 40%,var(--tymix));transition:background .4s,color .4s}
.slot{position:relative;flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--ov-1);overflow:hidden;transition:transform .3s var(--spring),box-shadow .2s}
.slot img{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;max-width:none;image-rendering:pixelated;transition:filter .5s,opacity .5s}
.slot.empty{background:none;border:1px dashed var(--edge-hi)}
.slot.pulse::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 2px var(--c);animation:flash .9s var(--out) both}
.row:hover .slot,.tile:hover .slot{transform:translateY(-2px)}
.wait{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wait b{font-weight:600;color:var(--c)}
.stat{flex:none;display:flex;flex-direction:column;gap:3px;min-width:52px;font-size:11px;color:var(--muted);white-space:nowrap}
.side.a .stat{align-items:flex-start}.side.b .stat{align-items:flex-end}
.stat .note{white-space:normal;max-width:110px;line-height:1.3}
.lv{display:flex;align-items:baseline;gap:3px;font:400 17px/1 var(--pix);color:var(--text)}
.lv>span{color:var(--muted)}
.lv b{font-weight:400;transition:color .3s}
.lv.over b{color:var(--danger)}
.roll{position:relative;display:inline-block;overflow:hidden;height:1em;line-height:1em;vertical-align:bottom}
.roll span{display:block}
.roll .out{position:absolute;inset:0 auto auto 0;animation:roll-out .45s var(--out) both}
.roll .in{animation:roll-in .45s var(--out) both}
.hp{position:relative;display:block;width:52px;height:5px;border-radius:3px;background:var(--ov-2);overflow:hidden}
.hp i{position:absolute;inset:0;border-radius:3px;transform-origin:left;transform:scaleX(var(--r,0))}
.hp .ghost{background:var(--text);opacity:.3;transition:transform .7s var(--out) .35s}
.hp .fill{background:var(--ok);transition:transform .3s var(--out),background .3s}
.hp.mid .fill{background:var(--warn)}
.hp.low .fill{background:var(--danger)}
.hpn{font-size:11px;color:var(--muted)}
.note.bad{color:var(--danger)}.note.warn{color:var(--warn)}
.tether{position:relative;display:flex;align-items:center;justify-content:center;height:24px;min-width:0}
.seg{position:absolute;top:50%;height:2px;width:50%;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--faint) 0 3px,transparent 3px 7px);opacity:.6}
.seg.a{left:0}.seg.b{right:0}
.seg::before{content:"";position:absolute;inset:0;background:var(--a);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--out)}
.seg.b::before{background:var(--b);transform-origin:right}
.row[data-a="1"] .seg.a,.row[data-b="1"] .seg.b{opacity:1}
.row[data-a="1"] .seg.a::before,.row[data-b="1"] .seg.b::before{transform:scaleX(1)}
.row.enter .seg::before{transition-delay:calc(var(--i,0)*40ms + .15s)}
.row:not(.lost)[data-b="0"] .seg.b{animation:dash 1s linear infinite}
.row:not(.lost)[data-a="0"] .seg.a{animation:dash 1s linear infinite reverse}
.loc{position:relative;z-index:1;max-width:100%;padding:3px 9px;border-radius:999px;background:var(--pillbg);border:1px solid var(--edge-hi);font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .4s,color .4s,border-color .4s}
.loc.pop{animation:pop .55s var(--spring)}
.row.lost .loc{color:var(--faint);text-decoration:line-through}
.row.lost .loc.snap{animation:snap .5s var(--out)}
.row.lost .names b{color:var(--muted)}
.row.lost .ty{background:var(--ov-2);color:var(--faint)}
.row.lost .slot img,.tile.lost .slot img{filter:grayscale(1);opacity:.45}
.row.multi{grid-template-columns:150px repeat(var(--n),minmax(0,1fr));column-gap:12px}
.row.multi .loc{justify-self:start}
.row.multi .side{display:grid;grid-template:"slot names" auto "slot stat" auto/42px minmax(0,1fr);gap:3px 10px;align-items:center}
.row.multi .idg{display:contents}
.row.multi .slot{grid-area:slot}
.row.multi .names{grid-area:names;align-items:flex-start}
.row.multi .wait{grid-area:1/2/3/3}
.row.multi .stat{grid-area:stat;flex-direction:row;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(170px + var(--n,2)*44px),1fr));gap:4px 14px}
.tile{display:flex;align-items:center;gap:12px;min-width:0;padding:6px 8px;border-radius:var(--r-md);transition:background .2s}
.tile:hover{background:var(--ov-1)}
.tile.enter{animation:rise .5s var(--out) backwards}
.duo{flex:none;display:flex;align-items:center}
.duo u{width:10px;height:2px;background:linear-gradient(90deg,var(--l,var(--a)) 50%,var(--r,var(--b)) 50%)}
.tile.lost .duo u{background:repeating-linear-gradient(90deg,var(--faint) 0 2px,transparent 2px 4px)}
.tile .slot{width:36px;height:36px;border-radius:10px}
.tile .slot img{width:48px;height:48px;margin:-24px 0 0 -24px}
.tt{min-width:0}
.tt b,.tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt b{font-weight:600;font-size:13px}
.tt small{font-size:12px;color:var(--muted)}
.tile.lost .tt b{color:var(--muted)}
.empty-list{padding:24px 6px;color:var(--muted)}
[data-mon]{cursor:pointer}
[data-mon]:hover .slot,.slot[data-mon]:hover{box-shadow:inset 0 0 0 1.5px var(--c,var(--edge-hi))}
.idg[data-mon]:focus-visible,.slot[data-mon]:focus-visible{outline:2px solid var(--c,var(--b));outline-offset:3px;border-radius:12px}

/* join steps on the links column */
.setup{padding:16px;margin-bottom:14px;border-radius:16px;border:1px dashed var(--edge-hi);background:var(--ov-0)}
.setup h3{font-size:14px;font-weight:600}
.setup ol{margin:10px 0 0;padding-left:18px;color:var(--muted)}
.setup li{padding:3px 0}
.setup .lead{margin-top:10px;font-size:13px;color:var(--muted)}
.cmd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--ov-2);color:var(--text);font-size:12.5px;overflow-x:auto}
.cmd code{font-family:var(--mono);white-space:normal;overflow-wrap:anywhere;min-width:0}
.cmd button{flex:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.cmd button:hover{color:var(--text)}

/* feed */
.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--out)}
.ev>div{overflow:hidden;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:7px 6px;border-radius:10px;transition:opacity .4s var(--out) .1s,transform .45s var(--out) .1s,background .2s}
.ev>div:hover{background:var(--ov-1)}
.ev.new{grid-template-rows:0fr}
.ev.new>div{opacity:0;transform:translateY(-6px)}
.evi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-size:13px;font-weight:700;font-style:normal}
.ev p{font-size:13px;line-height:1.35}
.ev b{font-weight:600}
.ev .bad{color:var(--danger)}
.ev time{display:block;margin-top:2px;font-size:11.5px;color:var(--faint)}
.feed-empty{color:var(--muted);font-size:13px}

/* cards for full views */
.card{padding:18px 20px}
.card>p,.rblock>p{margin-top:6px;color:var(--muted);font-size:13px;max-width:70ch}
.card h4{margin:16px 0 4px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;align-items:start}

/* encounters */
.etools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:2px;padding:4px;border-radius:var(--r-md);flex-wrap:wrap}
.filters button{padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--muted);transition:all .2s}
.filters button em{font-style:normal;color:var(--faint);margin-left:5px}
.filters button[aria-pressed=true]{background:var(--ov-3);color:var(--text)}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:var(--r-md);min-width:240px;color:var(--muted)}
.search input{all:unset;flex:1;min-width:0;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.tablep{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.thead,.erow{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n,2),minmax(0,1.2fr)) 120px;align-items:center;gap:16px;padding:0 20px}
.thead{flex:none;height:42px;border-bottom:1px solid var(--edge);font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.thead i{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%}
.erow{min-height:56px;border-bottom:1px solid var(--edge);transition:background .2s}
.erow:hover{background:var(--ov-1)}
.erow:last-child{border-bottom:0}
.eloc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecell{display:flex;align-items:center;gap:12px;min-width:0}
.ecell b,.ecell small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecell b{font-weight:600;line-height:1.3}
.ecell small{font-size:12px;color:var(--muted);line-height:1.3}
.ecell.none{color:var(--faint)}
.slot.sm{width:36px;height:36px;border-radius:10px}
.slot.sm img{width:48px;height:48px;margin:-24px 0 0 -24px}
.est{display:inline-flex;align-items:center;gap:7px;justify-self:start;padding:3px 9px;border-radius:8px;background:var(--ov-2);font-size:12px;font-weight:600;color:var(--muted)}
.est i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.est.team{color:var(--text)}
.est.boxed i{background:var(--muted)}
.est.open i{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.est.lost{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}.est.lost i{background:var(--danger)}
.erow.lost .slot img{filter:grayscale(1);opacity:.45}
.erow.lost .ecell b{color:var(--muted)}
.forget{margin-left:auto;flex:none;font-size:11px;padding:3px 8px;border-radius:7px;border:1px solid var(--edge-hi);color:var(--muted)}
.forget:hover,.forget.sure{color:var(--danger);border-color:var(--danger)}

/* team */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px;align-content:start}
.pairc{position:relative;display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));padding:28px 10px 16px;overflow:hidden}
.pairc .ploc{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1;max-width:60%;padding:2px 9px;border-radius:999px;background:var(--pillbg);border:1px solid var(--edge-hi);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pairc::before{content:"";position:absolute;left:50%;top:22px;bottom:22px;width:2px;background:linear-gradient(var(--a),var(--b));opacity:.8}
.pairc.multi::before{display:none}
.tm{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border-radius:14px;min-width:0;text-align:center;transition:background .2s}
.tm:hover{background:var(--ov-1)}
.tm .stage{width:96px;height:80px}
.tm b{font-size:15px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm small{font-size:12px;color:var(--muted)}
.tm .hpl{width:100%;max-width:200px;margin-top:6px}
.tm .tys{justify-content:center;margin-top:2px}
.tm.empty{color:var(--faint);justify-content:center;font-size:12.5px}

/* timeline */
.tl{position:relative;padding:8px 20px 20px 20px}
.tday{margin:14px 0 6px 52px;font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.trow{position:relative;display:grid;grid-template-columns:44px 28px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 6px;border-radius:12px}
.trow:hover{background:var(--ov-1)}
.trow::before{content:"";position:absolute;left:69px;top:-6px;bottom:-6px;width:2px;background:var(--edge)}
.trow time{font:400 17px var(--pix);color:var(--muted);text-align:right}
.trow .evi{position:relative;z-index:1}
.trow p b{font-weight:600}
.trow .bad{color:var(--danger)}
.trow .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.trow .who i{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* rules + settings */
.rules{display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.rblock{padding:18px 20px}
.rblock h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.rblock h3{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;align-items:start}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.caps{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.capc{position:relative;min-width:74px;padding:10px 14px;border:1px solid var(--edge);border-radius:var(--r-md);background:var(--ov-0);transition:all .3s}
.capc small{display:block;font-size:11.5px;color:var(--muted)}
.capc b{font:400 26px/1 var(--pix)}
.capc.done{opacity:.45}
.capc.done b{text-decoration:line-through;text-decoration-thickness:2px}
.capc.now{border-color:transparent;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 20%,transparent),color-mix(in srgb,var(--b) 14%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 50%,transparent),0 10px 30px -16px var(--a)}
.capline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.capline span{padding:3px 8px;border:1px solid var(--edge);border-radius:7px;font-size:12.5px}
.capline i{font-style:normal;color:var(--muted)}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px;list-style:none}
.rlist li{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r-md);background:var(--ov-1);border:1px solid var(--edge)}
.rlist b{font-weight:600}
.rlist span{color:var(--muted);font-size:13px}
.rblock ol.steps{margin:10px 0 0;padding-left:18px;color:var(--muted)}
.rblock ol.steps li{padding:3px 0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid var(--edge);font-size:13px}
.kv:last-child{border-bottom:0}
.kv>span{flex:none;color:var(--muted)}
.kv>span small{font-size:11.5px;opacity:.8}
.kv b{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0;max-width:70%;font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv b>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kv b button{flex:none;padding:4px 9px;border-radius:8px;border:1px solid var(--edge-hi);font-size:12px;font-weight:600;color:var(--muted);transition:all .15s}
.kv b button:hover{color:var(--text);background:var(--ov-2)}
.kv b select,.kv b input{font-size:12.5px;color:var(--text);background:var(--ov-1);border:1px solid var(--edge-hi);border-radius:8px;padding:5px 8px;max-width:100%}
.kv b select option{background:var(--solid);color:var(--text)}
.kv b input[type=number]{width:80px;text-align:right}
.rblock>p.bad{color:var(--danger);white-space:pre-line}
.btn2{height:38px;margin-top:14px;padding:0 14px;border-radius:11px;border:1px solid var(--edge-hi);background:var(--ov-1);font-size:13px;font-weight:600;transition:color .2s,border-color .2s,background .2s,transform .12s var(--out)}
.btn2:hover{background:var(--ov-2)}
.btn2.arm{border-color:var(--danger);color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn2:disabled{opacity:.5;cursor:default}
.btn2.hot{border:0;color:#fff;background:linear-gradient(100deg,#FF7A35,#2E9BD6)}
.btn2.hot.arm{background:var(--danger)}
.runs{margin-top:10px;display:flex;flex-direction:column}
.runrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--edge)}
.runrow:last-child{border-bottom:0}
.runrow>div{min-width:0;flex:1}
.runrow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runrow small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runrow .now{font-size:12px;color:var(--ok)}
.runrow .btn2{margin-top:0;height:32px;flex:none}
.runrow .drop{flex:none;font-size:12.5px;color:var(--muted)}
.runrow .drop:hover,.runrow .drop.arm{color:var(--danger)}
.err{color:var(--danger);font-size:13px}

/* types */
.types{padding:18px 20px}
.types>p{color:var(--muted)}
.tgrid{display:grid;grid-template-columns:112px repeat(17,minmax(28px,1fr));grid-template-rows:44px repeat(17,30px);gap:3px;max-width:1100px;margin-top:14px;font-size:12.5px}
.tgrid i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--tc)}
.tgrid>*{display:flex;align-items:center;justify-content:center;min-height:0;border-radius:6px;transition:background .15s,color .15s,opacity .25s,box-shadow .15s,transform .15s}
.tgrid button:active{transform:none}
.tgrid .rh{justify-content:flex-start;gap:8px;padding-left:8px;font-size:12.5px;font-weight:600}
.tgrid .ch{flex-direction:column;gap:3px;color:var(--muted);font-weight:600;font-size:11.5px}
.tgrid .tc{background:var(--ov-1);cursor:pointer;font:400 16px var(--pix)}
.tgrid .se{background:color-mix(in srgb,var(--ok) 30%,transparent)}
.tgrid .nve{background:color-mix(in srgb,var(--danger) 24%,transparent);color:var(--muted)}
.tgrid .no{background:var(--text);color:var(--night)}
.tgrid .hi.rh,.tgrid .hi.ch,.tgrid .sel{background:var(--ov-3);color:var(--text)}
.tgrid .tc.hi{box-shadow:inset 0 0 0 1px var(--edge-hi)}
.tgrid.focus .tc:not(.on){opacity:.22}
.tgrid.focus .rh:not(.sel),.tgrid.focus .ch:not(.sel){opacity:.45}
.tgrid .tc.x{box-shadow:inset 0 0 0 2px var(--text);transform:scale(1.08)}
.tleg{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;font-size:13px;color:var(--muted)}
.tleg span{display:flex;align-items:center;gap:8px}
.tleg b{display:inline-flex;align-items:center;justify-content:center;width:28px;height:22px;border-radius:6px;font:400 16px var(--pix);color:var(--text)}
.tleg .se{background:color-mix(in srgb,var(--ok) 30%,transparent)}
.tleg .nve{background:color-mix(in srgb,var(--danger) 24%,transparent);color:var(--muted)}
.tleg .no{background:var(--text);color:var(--night)}

/* ===== Pokémon card: one overview */
dialog.mon{width:min(1060px,calc(100vw - 32px));max-height:min(92vh,960px);margin:auto;padding:0;border:1px solid var(--edge-hi);border-radius:22px;background:var(--dlg-bg);color:var(--text);overflow:auto;overscroll-behavior:contain;box-shadow:0 30px 80px -20px rgba(0,0,0,.55);backdrop-filter:blur(20px)}
dialog.mon::backdrop{background:rgba(var(--shade),.55);backdrop-filter:blur(6px)}
dialog.mon[open]{animation:rise .5s var(--spring) backwards}
.x{position:absolute;right:14px;top:14px;z-index:2;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ov-2);color:var(--muted);transition:all .2s}
.x:hover{background:var(--ov-3);color:var(--text);transform:rotate(90deg)}
.dh{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:center;padding:22px 60px 22px 24px;background:radial-gradient(60% 140% at 8% 40%,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%);border-bottom:1px solid var(--edge)}
.dstage{position:relative;height:140px;display:grid;place-items:center}
.dstage::before{content:"";position:absolute;bottom:10px;left:50%;width:130px;height:30px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 55%,transparent),transparent);animation:pulse 3s ease-in-out infinite}
.dstage img{position:relative;width:144px;height:144px;image-rendering:pixelated;animation:bob 2.6s ease-in-out infinite}
.did .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.did .who i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.did h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.did h2 small{font:400 24px var(--pix);color:var(--muted);letter-spacing:0}
.did .spc{color:var(--muted);font-size:13px}
.did .tys{margin:8px 0 10px}
.did .hpl{max-width:280px}
.facts3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fx{padding:9px 11px;border-radius:12px;background:var(--ov-1);border:1px solid var(--edge);min-width:0}
.fx>span{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.fx>b{display:flex;align-items:center;gap:8px;margin-top:3px;font-weight:600}
.fx small{display:block;margin-top:2px;color:var(--muted);font-size:11.5px;line-height:1.35}
.itm{flex:none;width:28px;height:28px;border-radius:8px;background:var(--ov-2);display:grid;place-items:center;overflow:hidden}
.itm img{width:24px;height:24px;image-rendering:pixelated}
.nat{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.nat span{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600}
.nat .up{color:var(--up)}.nat .dn{color:var(--dn)}
.nat svg,.sts svg{width:9px;height:9px}
.partner{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px 6px 6px;border-radius:12px;border:1px dashed var(--edge-hi);text-align:left;transition:all .25s var(--out)}
.partner:hover{border-style:solid;border-color:var(--pc);background:color-mix(in srgb,var(--pc) 10%,transparent)}
.partner .slot{width:36px;height:36px}
.partner .slot img{width:48px;height:48px;margin:-24px 0 0 -24px}
.partner small{display:block;color:var(--muted);font-size:11px}
.partner b{font-size:12.5px;font-weight:600}
.db{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.db>section{padding:18px 22px;min-width:0}
.db>section+section{border-left:1px solid var(--edge)}
.db h3{display:flex;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.db h3+*+h3,.db h3.gap{margin-top:20px}
.db h3 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500}
.mon-note{margin:0 22px;padding:12px 0 0;font-size:13px;color:var(--muted)}
.db .mon-note{margin:0;padding:0}
.mvr{display:grid;grid-template-columns:68px minmax(0,1fr) 20px 44px 48px 58px;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--edge)}
.mvr:first-child,.mvr.hd+.mvr{border-top:0}
.mvr.hd{padding:0 4px 6px;font-size:10.5px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.mvr.hd span:nth-child(n+4){text-align:right}
.mvr .ty{justify-self:start;min-width:58px;text-align:center}
.mvr .mn{min-width:0}
.mvr .mn b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvr .mn small{display:block;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvr .n{font:400 18px var(--pix);text-align:right}
.mvr .n.dim{color:var(--faint)}
.mvr .n.low{color:var(--dn)}
.mvr .ci{display:grid;place-items:center;color:var(--muted)}
.mvr .ci svg{width:16px;height:16px}
.mvr .ci.physical{color:var(--a)}.mvr .ci.special{color:var(--b)}
.lsr{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px;border-top:1px solid var(--edge);font-size:13px}
.lsr:first-child{border-top:0}
.lsr .l{font:400 18px var(--pix);color:var(--muted)}
.lsr b{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsr.has,.lsr.past{opacity:.5}
.lsr.next b,.lsr.next .l,.lsr .nx{color:var(--c)}
.lsr .nx{font-size:11px;font-weight:600}
.sts{display:grid;grid-template-columns:110px 36px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px}
.sts span{display:flex;align-items:center;gap:5px;color:var(--muted)}
.sts b{font:400 19px var(--pix);text-align:right}
.sts i{height:7px;border-radius:4px;background:var(--ov-2);overflow:hidden}
.sts i::after{content:"";display:block;height:100%;width:var(--w);background:var(--bc,var(--muted));border-radius:4px;animation:grow 1s var(--out) both}
.sts .up{color:var(--up)}.sts .dn{color:var(--dn)}
.sts .up+b+i{--bc:var(--up)}.sts .dn+b+i{--bc:var(--dn)}

/* ===== start + setup (no run yet) */
.stage-page{flex:1;min-height:0;overflow-y:auto;padding:6px 2px 24px}
.form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-content:start;max-width:1180px}
.form.narrow{grid-template-columns:minmax(0,560px)}
.fhead{grid-column:1/-1;padding:4px 6px 6px}
.fhead h1{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.fhead .lead{margin-top:8px;font-size:15px;color:var(--muted);max-width:60ch}
.fcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.pane{display:flex;flex-direction:column;gap:18px;padding:18px 20px;animation:fade .35s var(--out) backwards}
.pane>h3{font-size:15px;font-weight:600;margin-bottom:-6px}
.runs-pane h2{font-size:15px;font-weight:600}
.runs-pane>p{margin-top:4px;color:var(--muted);font-size:13px}
.ptabs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:var(--r-md)}
.ptabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:10px;background:var(--ov-3);transition:transform .45s var(--spring)}
.ptabs[data-i="1"]::before{transform:translateX(calc(100% + 4px))}
.ptabs button{position:relative;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--muted);transition:color .2s}
.ptabs button[aria-selected=true]{color:var(--text)}
.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:600}
.field input:not([type=checkbox]){width:100%;height:44px;padding:0 14px;background:var(--ov-1);border:1px solid var(--edge);border-radius:12px;font-size:14.5px;outline:0;transition:border-color .15s,background .15s}
.field input::placeholder{color:var(--faint)}
.field input:focus{border-color:var(--edge-hi);background:var(--ov-2)}
.field small{display:block;margin-top:8px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.field small.ok{color:var(--ok)}
.field small.bad{color:var(--danger)}
.filerow{display:flex;gap:8px}
.filerow input{flex:1;min-width:0}
.filerow button{flex:none;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--edge-hi);background:var(--ov-1);font-weight:600;transition:background .15s}
.filerow button:hover{background:var(--ov-2)}
.romc{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:1px dashed var(--edge-hi);background:var(--ov-0)}
.romc.ok{border-style:solid}
.cart{flex:none;position:relative;width:46px;height:52px;border-radius:7px 7px 9px 9px;background:linear-gradient(180deg,#2A2840,#1B1A2E);border:1px solid var(--edge-hi)}
.cart::before{content:"";position:absolute;left:7px;right:7px;top:7px;height:23px;border-radius:4px;background:linear-gradient(135deg,var(--a),#3A2440 50%,var(--b))}
.cart::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:5px;background:repeating-linear-gradient(90deg,#C9A24A 0 3px,transparent 3px 5px)}
.romc.off .cart{filter:grayscale(1);opacity:.5}
.romc>div{flex:1;min-width:0}
.romc b{display:block;font-weight:600}
.romc small{display:block;color:var(--muted);font-size:12px}
.romc small.ok{color:var(--ok)}.romc small.bad{color:var(--danger)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(100deg,#FF7A35,#FF9A5C 48%,#4FB6E8 52%,#2E9BD6);background-size:220% 100%;box-shadow:0 10px 40px -12px color-mix(in srgb,var(--a) 70%,transparent);transition:background-position .7s var(--out),transform .25s var(--spring)}
.btn:hover{background-position:100% 0;transform:translateY(-2px)}
.btn:disabled{opacity:.6;transform:none}
.btn.busy{cursor:progress;opacity:1}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:turn .8s linear infinite}
p.slow{margin-top:-6px;text-align:center;font-size:13px;color:var(--muted)}
.checks{display:grid;gap:0}
.checks label{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:2px 14px;padding:11px 0;border-top:1px solid var(--edge);cursor:pointer;margin:0;font-size:13.5px;font-weight:600}
.checks label:first-child{border-top:0}
.checks label>small,.checks label>.capline{grid-column:1;margin:0;font-weight:400}
.checks label>span{grid-column:1;grid-row:1}
.checks input{grid-column:2;grid-row:1/span 3;align-self:center}
input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:40px;height:23px;margin:0;border-radius:12px;background:var(--ov-3);cursor:pointer;transition:background .25s}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
input[type=checkbox]:checked{background:linear-gradient(90deg,var(--a),var(--b))}
input[type=checkbox]:checked::after{transform:translateX(17px)}
input[type=checkbox]:disabled{opacity:.55;cursor:default}
.checks input:disabled+span{color:var(--muted)}
.crow input[type=checkbox]{width:34px;height:20px}.crow input[type=checkbox]::after{width:14px;height:14px}.crow input[type=checkbox]:checked::after{transform:translateX(14px)}
details.adv summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
details.adv .field{margin-top:12px}
.center-msg{padding:96px 16px;text-align:center;color:var(--muted)}

/* ===== motion */
@keyframes rise{from{opacity:.001;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes snap{0%,100%{transform:none}20%{transform:translateX(-3px)}45%{transform:translateX(3px)}70%{transform:translateX(-1.5px)}}
@keyframes flash{0%{opacity:0;transform:scale(.8)}30%{opacity:1;transform:none}100%{opacity:0}}
@keyframes ping{0%{transform:none;opacity:.5}70%,100%{transform:scale(2.6);opacity:0}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
@keyframes roll-out{to{transform:translateY(-100%);opacity:0}}
@keyframes roll-in{from{transform:translateY(100%);opacity:0}}
@keyframes dash{to{background-position:7px 0}}
@keyframes turn{to{transform:rotate(1turn)}}
@keyframes spin{to{transform:rotate(-360deg)}}
@keyframes tw{50%{opacity:.15}}
@keyframes flow{from{stroke-dashoffset:1960}to{stroke-dashoffset:0}}
@keyframes sheen{to{background-position:100% 0}}
@keyframes shine{0%,60%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes pulse{50%{opacity:.55;transform:translateX(var(--tx,0)) scale(.9)}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{from{width:0}}
.dstage::before{--tx:-50%}

/* ===== window sizes: 1920 × 1080 first, then smaller */
@media (min-width:1700px){
  .shell{grid-template-columns:272px minmax(0,1fr);gap:16px;padding:16px}
  .col{padding:20px 22px}
}
@media (max-width:1499px){
  .shell{grid-template-columns:232px minmax(0,1fr)}
  .hpanel{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);grid-template-rows:minmax(0,1fr) minmax(0,.75fr);grid-template-areas:"live links" "feed links"}
  .col.live{border-right:1px solid var(--edge)}
  .col.feedc{border-top:1px solid var(--edge);border-right:1px solid var(--edge)}
  .col.links{border-right:0}
  .orden{min-width:260px}
  .status span,#lang{display:none}
}
@media (max-width:1240px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .orden{min-width:0}
  .status span{display:none}
  .dh{grid-template-columns:120px minmax(0,1fr);padding-right:56px}
  .dh .facts3{grid-column:1/-1}
  .dstage img{width:120px;height:120px}
}
/* narrower than a laptop: the page scrolls as a whole, the sidebar becomes a strip */
@media (max-width:1040px){
  body{overflow:auto}
  html,body,#app{height:auto}
  .shell{display:flex;flex-direction:column;min-height:100vh;padding:12px}
  .sbar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;overflow:visible}
  .sbar .brand{padding:4px 8px}
  .sbar .sh,.sbar .grow,.sbar .ver,.sbar .slinks{display:none}
  .sbar .srun{width:auto;padding:5px 8px}
  .sbar .srun .ico{width:30px;height:30px}
  .sbar .srun.on::before{display:none}
  .sbar .newrun{margin:0 0 0 auto;padding:8px 12px}
  .main{gap:14px}
  .view,.scroll,.col,.tablep{overflow:visible}
  .view{flex:none}
  .hpanel{display:flex;flex-direction:column;overflow:visible}
  .col{border-right:0!important;border-top:1px solid var(--edge)}
  .col:first-child{border-top:0}
  .tgrid{min-width:640px}
  .types{overflow-x:auto}
  .db{grid-template-columns:minmax(0,1fr)}

  .top .sp{display:none}
  .status,#lang{display:none}
  .hero h1{font-size:44px}
  .play{height:52px;font-size:16px;padding:0 18px}
  .sq{width:52px;height:52px}
  .row{grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);padding:6px 2px}

  .loc{padding:3px 6px;font-size:11px}

  .trow .who{display:none}

  .wild2{grid-template-columns:64px minmax(0,1fr) 72px}

  .fhead h1{font-size:34px}
}

    const err = $("#err"), btn = $(".btn", pane), raw = $("#f-caps").value.trim();
    const caps = parseCaps(raw);
    if (!caps) { err.textContent = t().capsErr; err.hidden = false; return; }
    btn.disabled = true;
    try {
      const res = await fetch("/api/runs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ players: newPlayers, caps, rules: readRules(caps) }) });
      if (!res.ok) throw new Error(await res.text());
      location.href = "/run/" + encodeURIComponent((await res.json()).code);
    } catch (e2) { btn.disabled = false; err.textContent = String(e2.message || e2); err.hidden = false; }
  };
}

  const chosen = state.settings && state.settings.rules && state.settings.rules.length ? state.settings.rules : RULES_DEFAULT;
  const withSave = state.players.filter(p => p.snapshot);
  const badges = withSave.length ? Math.min(...withSave.map(p => p.snapshot.trainer.badges)) : 0;
  const now = Math.min(badges, caps.length - 1);
  const sig = [lang, caps.join(), now, chosen.join()].join("|"), el = $("#rules");
  if (el._sig === sig) return;

  el.innerHTML = `<section class="rblock glass reveal"><h2>${t().rCaps}</h2>${caps.length

      : `<p>${t().rNoCaps}</p>`}</section>

}

// A button that asks for a second click before it acts.
function confirmButton(btn, label, sure, act) {
  btn.onclick = () => {
    if (!armed() || armFor !== btn.id) {
      armUntil = Date.now() + 4000; armFor = btn.id;
      btn.classList.add("arm"); btn.textContent = sure;
      setTimeout(() => { const b = document.getElementById(btn.id); if (b && !armed()) { b.classList.remove("arm"); b.innerHTML = label; } }, 4100);
      return;
    }
    armUntil = 0; act(btn);
  };
}
