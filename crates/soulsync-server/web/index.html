    ])}</div></section>
    <section class="rblock glass"><h2>${t().sRun}</h2><div style="margin-top:6px">${kv([
      [t().code, `<span class="mono">${esc(state.code)}</span>`],
      [t().sSync, `<i class="dot ${local.phase}"></i>${t().phase[local.phase] || local.phase}${local.message ? `  ·  ${esc(local.message)}` : ""}`],
      [t().sServer, local.server ? esc(local.server) : t().sLocal],
      [t().sBuild, local.update && local.update.build ? local.update.build : "–"],
      [t().sDex, !local.dex ? "–" : local.dex.error ? `<span class="bad" title="${esc(local.dex.error)}">${t().sDexBad}: ${esc(local.dex.error)}</span>` : t().sDexOk(local.dex.moves)],
    ])}</div><p>${t().sLeaveHint}</p><button type="button" class="btn2" id="leave">${t().sLeave}</button></section>`;
    if (runsHtml(false)) html += `<section class="rblock glass" id="myruns">${runsHtml(false)}</section>`;
    if (local.live) html += `<section class="rblock glass"><h2>${t().sLive}</h2><div style="margin-top:6px">${kv([
      [t().sSync, `<i class="dot ${local.live.active ? "live" : "idle"}"></i>${!local.live.active ? t().sLiveOff : local.live.foreign ? t().sLiveForeign : t().sLiveOn}`],
      [t().sLua, t().sLuaState[local.live.lua] || "–"],
      [t().sAuto, t().sAutoState[local.live.auto] || "–"],
      ...(local.live.active ? [[t().sPlace, local.live.place ? esc(local.live.place[lang]) : t().sPlaceNone]] : []),
    ])}</div><p>${t().sLiveHint}</p><div class="cmd" id="liveScript"><code>${esc(local.live.script)}</code><button type="button">${t().copy}</button></div></section>`;
  }
  html += `<section class="rblock glass"><h2>${t().attempt(state.attempt || 1)}</h2><p>${t().rRetry}</p><button type="button" class="btn2" id="retry">${t().retry}</button></section>`;
  if (local && local.fresh) {
    const f = local.fresh, pr = f.progress, busy = pr && pr.state === "rolling";
    const pickBtn = kind => local.dialogs ? `<button type="button" data-fresh="${kind}">${t().freshPick}</button>` : "";
    const file = (p, kind) => `${p ? `<span title="${esc(p)}">${name(p)}</span>` : "–"}${pickBtn(kind)}`;
    const opt = f.options, ok = opt && opt.ok, r = f.rando || {};
    const ready = f.original && f.original.ok && f.randomizer && f.preset && ok;
    const note = !pr ? "" : pr.state === "done" ? `<p>${f.awaiting ? t().freshAwait : t().freshDone}</p>` : pr.state === "failed" ? `<p class="bad">${t().freshWhy[pr.why] || pr.why}${pr.detail ? " " + esc(pr.detail) : ""}</p>` : "";
    const compatSel = key => `<select data-rando="${key}"><option value="">${t().asFile(ok ? t().compat[opt[key]] : "–")}</option>${Object.keys(t().compat).map(c => `<option value="${c}"${r[key] === c ? " selected" : ""}>${t().compat[c]}</option>`).join("")}</select>`;
    const hmSel = `<select data-rando="full_hm"><option value="">${t().asFile(ok ? (opt.full_hm ? t().yes : t().no) : "–")}</option><option value="true"${r.full_hm === true ? " selected" : ""}>${t().yes}</option><option value="false"${r.full_hm === false ? " selected" : ""}>${t().no}</option></select>`;
    const saveRow = f.template && f.template.ok ? t().freshKept(esc(f.template.trainer), f.template.pokemon) : f.awaiting ? t().freshAwait : t().freshNone;
    html += `<section class="rblock glass" id="freshsec"><h2>${t().fresh}</h2><p>${t().freshLead}</p><div style="margin-top:6px">${kv([
      [t().freshOriginal, file(f.original && f.original.path, "original")],
      [t().freshRando, file(f.randomizer, "randomizer")],
      [t().freshPreset, file(f.preset, "preset")],
      [t().freshSave, `${saveRow}<button type="button" data-fresh="template">${t().freshKeep}</button>`],
    ])}</div><p>${t().freshSaveHint}</p>
    <h3 style="margin-top:14px">${t().freshOptions}</h3>${opt && !ok ? `<p class="bad">${t().presetBad} ${esc(opt.error)}</p>` : `<p>${t().freshOptLead}${ok && opt.random_tm_moves ? " " + t().tmMoves : ""}</p>`}<div style="margin-top:6px">${kv([
      [t().fTm, compatSel("tm")],
      [t().fHm, hmSel],
      [t().fTutor, compatSel("tutor")],
      [`${t().fCandies}<br><small>${t().fCandiesHint}</small>`, `<input type="number" min="0" max="999" step="1" id="candies" value="${+f.candies || 0}">`],
    ])}</div>${note}${ready ? "" : `<p>${t().freshNeed}</p>`}<button type="button" class="btn2" id="fresh"${ready && !busy ? "" : " disabled"}>${busy ? t().freshBusy : t().freshDo}</button></section>`;
  }
  if (!local) html += `<section class="rblock glass"><h2>${t().setup}</h2><ol class="steps"><li>${t().step1}</li><li>${t().step2}<div class="cmd"><code>${esc(syncCmd())}</code><button type="button">${t().copy}</button></div></li><li>${t().step3}</li></ol></section>`;
  el.innerHTML = html;
  $("#lang2", el).onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.l !== lang) setLang(b.dataset.l); };
  $("#theme2", el).onclick = toggleTheme;
  const cmd = $(".cmd:not(#liveScript) button", el);
  if (cmd) cmd.onclick = e => copyText(syncCmd(), e.currentTarget);
  const script = $("#liveScript button", el);
  if (script) script.onclick = e => copyText(local.live.script, e.currentTarget);
  confirmButton($("#retry"), t().retry, t().retrySure, btn => {
    btn.disabled = true;
    if (window.SoulSyncDemoRestart) { window.SoulSyncDemoRestart(); btn.disabled = false; btn.classList.remove("arm"); btn.textContent = t().retry; }
    else fetch(`${SRV}/api/runs/${encodeURIComponent(state.code)}/attempt`, { method: "POST" }).catch(() => {}).finally(() => { el._sig = ""; updateSettings(); });
  });
  const takeLocal = async r => { if (r && r.ok) local = await r.json(); el._sig = ""; updateSettings(); };
  for (const b of el.querySelectorAll("[data-fresh]")) b.onclick = async () => {
    b.disabled = true;
    const kind = b.dataset.fresh;
    await takeLocal(await (kind === "template" ? localPost("template") : localPost("pick", { kind })).catch(() => null));
  };
  const randoNow = () => {
    const o = {};
    for (const sel of el.querySelectorAll("[data-rando]")) {
      const v = sel.value;
      o[sel.dataset.rando] = v === "" ? null : v === "true" ? true : v === "false" ? false : v;
    }
    return o;
  };
  for (const sel of el.querySelectorAll("[data-rando]")) sel.onchange = async () => { await takeLocal(await localPost("set", { rando: randoNow() }).catch(() => null)); };
  const candies = $("#candies", el);
  if (candies) candies.onchange = async () => {
    const n = Math.max(0, Math.min(999, Math.round(+candies.value) || 0));
    await takeLocal(await localPost("set", { candies: n }).catch(() => null));
  };
  const fresh = $("#fresh");
  if (fresh && !fresh.disabled) confirmButton(fresh, t().freshDo, t().freshSure, async btn => {
    btn.disabled = true;
    const from = state.attempt || 1;
    const r = await localPost("fresh").catch(() => null);
    // A new game is a new attempt. When the other players start over too,
    // the server counts it once.
    if (r && r.ok && state.code && !window.SoulSyncDemoRestart) await fetch(`${SRV}/api/runs/${encodeURIComponent(state.code)}/attempt?from=${from}`, { method: "POST" }).catch(() => {});
    await takeLocal(r);
  });
  if ($("#myruns", el)) bindRuns($("#myruns", el), () => { el._sig = ""; updateSettings(); });
  const leave = $("#leave");
  if (leave) confirmButton(leave, t().sLeave, t().sLeaveSure, async () => { await localPost("leave").catch(() => {}); location.reload(); });
}

function capNow() {
  const caps = state.settings && state.settings.caps || [];
  if (!caps.length) return null;
  const withSave = state.players.filter(p => p.snapshot);
  const badges = withSave.length ? Math.min(...withSave.map(p => p.snapshot.trainer.badges)) : 0;
  return caps[Math.min(badges, caps.length - 1)];
}

function model() {
  const cap = capNow();
  return state.links.map(l => {
    const sides = seatList().map(i => l.sides[i] || null);
    const dead = sides.some(s => s && (s.status === "fainted" || s.status === "missed"));
    const complete = sides.every(Boolean);
    const sec = dead ? "lost" : !complete ? "open" : sides.some(s => s.status === "party") ? "team" : "boxed";
    return { key: String(l.location), link: l, sides, dead, sec, cap };
  });
}

// In the app the pictures come from the player's own ROM; elsewhere, and
// when the ROM has none, from the address the server names.
function spriteSrc(species) {
  const remote = !sprites ? "" : typeof sprites === "function" ? sprites(species) : sprites.replace("{id}", species);
  const own = local && local.art ? `/api/local/sprite/${species}` : "";
  return { src: own || remote, alt: own ? remote : "" };
}
function spriteImg(p) {
  const s = spriteSrc(p.species);
  if (!s.src) return "";
  const back = s.alt ? `this.onerror=()=>this.remove();this.src='${esc(s.alt)}'` : "this.remove()";
  return `<img src="${esc(s.src)}" alt="" loading="lazy" decoding="async" onerror="${back}">`;
}
function itemImg(id) {
  return local && local.art && id ? `<span class="itm"><img src="/api/local/item/${id}" alt="" onerror="this.parentNode.remove()"></span>` : "";
}

function sideSig(m, i) {
  const s = m.sides[i];
  if (!s) return ["empty", m.dead, lang, state.players.map(p => p.name).join()].join("|");
  const p = s.pokemon;
  const others = m.sides.map((o, j) => j !== i && o && o.status).join();
  return [p.pid, p.species, p.nickname, p.is_nicknamed, s.status, m.dead, p.place.kind, p.place.box, others, lang].join("|");
}

function sideHtml(m, i) {
  const s = m.sides[i];
  if (!s) {
    const other = state.players[i];
    return `<div class="idg"><span class="wait">${m.dead ? esc(t().locked) : other ? t().turn(esc(other.name)) : esc(t().waitPlayer(i + 1))}</span><span class="slot empty"></span></div>`;
  }
  const p = s.pokemon, b = p.battle;
  let stat;
  if (m.dead) stat = s.status === "missed" ? `<span class="note bad">${t().missed}</span>` : s.status === "fainted" ? `<span class="note bad">${b ? t().faintedAt(b.level) : t().fainted}</span>` : `<span class="note">${t().lostWith}</span>`;
  else if (!b) {
    const split = m.sides.some((o, j) => j !== i && o && o.status === "party");
    stat = `<span class="note ${split ? "warn" : ""}">${t().box(p.place.box ?? "")}${split ? "  ·  " + t().partnerInTeam : ""}</span>`;
  }
  else stat = `<span class="lv"><span>${t().lv}</span><b class="roll" data-v="${b.level}"><span>${b.level}</span></b></span><span class="hp"><i class="ghost"></i><i class="fill"></i></span><span class="hpn"></span>`;
  const tys = (p.types || []).map(ty => `<span class="ty" style="--tc:${TCOL[ty]}">${esc(typeName(ty))}</span>`).join("");
  return `<div class="stat">${stat}</div><div class="idg" data-mon="${p.pid}" data-seat="${i}" role="button" tabindex="0" title="${esc(t().mon.open)}"><div class="names"><b title="${esc(species(p))}">${esc(label(p))}</b><div class="tys">${tys}</div></div><span class="slot">${spriteImg(p)}</span></div>`;
}

function patchStat(el, m, i, fresh) {
  const s = m.sides[i], b = s && s.pokemon.battle;
  if (!b || m.dead) return;
  const hp = $(".hp", el), lv = $(".roll", el), r = b.max_hp ? b.hp / b.max_hp : 0;
  const set = () => { hp.style.setProperty("--r", r.toFixed(3)); hp.classList.toggle("low", r < .35); hp.classList.toggle("mid", r >= .35 && r < .6); };
  if (fresh) nextFrame(set); else set();
  $(".hpn", el).textContent = `${b.hp}/${b.max_hp}`;
  $(".lv", el).classList.toggle("over", m.cap != null && b.level > m.cap);
  if (+lv.dataset.v !== b.level) {
    const up = b.level > +lv.dataset.v;
    lv.innerHTML = `<span class="out">${+lv.dataset.v}</span><span class="in">${b.level}</span>`;
    lv.dataset.v = b.level;
    lv.lastChild.addEventListener("animationend", () => { lv.innerHTML = `<span>${lv.dataset.v}</span>`; }, { once: true });
    if (up) once($(".slot", el), "pulse");
  }
}

function patchRow(el, m, fresh) {
  const sideEls = el.querySelectorAll(":scope > .side");
  for (const i of seatList()) {
    const side = sideEls[i], sig = sideSig(m, i);
    if (!side) continue;
    if (side._sig !== sig) {
      const had = side._sig !== undefined;
      side._sig = sig; side.innerHTML = sideHtml(m, i);
      if (had && !fresh) once(side, "swap");
      patchStat(side, m, i, true);
    } else patchStat(side, m, i, false);
  }
  const loc = $(".loc", el), name = locName(m.link);
  if (loc.textContent !== name) { loc.textContent = name; loc.title = name; }
  const was = el._sec;
  el._sec = m.sec;
  el.classList.toggle("lost", m.dead);
  const draw = () => { el.dataset.a = m.sides[0] && !m.dead ? 1 : 0; el.dataset.b = m.sides[1] && !m.dead ? 1 : 0; };
  if (fresh) nextFrame(draw); else draw();
  if (was && was !== m.sec) {
    if (m.sec === "lost") once(loc, "snap");
    else if (was === "open") once(loc, "pop");
  }
}

// Two players face each other across the location; more sit in columns
// under their names.
function newRow() {
  const el = document.createElement("div"), n = seats();
  el.className = "row enter" + (n > 2 ? " multi" : ""); el._kind = "row";
  el.innerHTML = n > 2
    ? `<span class="loc"></span>` + seatList().map(i => `<div class="side" style="--c:${col(i)}"></div>`).join("")
    : `<div class="side a" style="--c:var(--a)"></div><div class="tether"><i class="seg a"></i><span class="loc"></span><i class="seg b"></i></div><div class="side b" style="--c:var(--b)"></div>`;
  el.addEventListener("animationend", e => { if (e.target === el) el.classList.remove("enter"); });
  return el;
}

function newTile() {
  const el = document.createElement("div");
  el.className = "tile enter"; el._kind = "tile";
  el.addEventListener("animationend", e => { if (e.target === el) el.classList.remove("enter"); });
  return el;
}

function patchTile(el, m) {
  const mons = m.sides.map(s => s && s.pokemon);
  const fallen = m.sides.find(s => s && s.status === "fainted"), missed = m.sides.find(s => s && s.status === "missed");
  const sig = [mons.map(p => p ? [p.pid, p.species, p.nickname].join(":") : "").join(), m.sec, fallen && fallen.pokemon.pid, missed && missed.pokemon.pid, lang].join("|");
  if (el._sig === sig) return;
  el._sig = sig;
  el.classList.toggle("lost", m.dead);
  const why = fallen ? t().evFainted(label(fallen.pokemon)).replace(/<[^>]+>/g, "").replace(/\.$/, "") : missed ? `${species(missed.pokemon)} ${t().missed.toLowerCase()}` : "";
  const sub = locName(m.link) + (why ? "  ·  " + why : "");
  const slot = (p, i) => p ? `<span class="slot sm" data-mon="${p.pid}" data-seat="${i}" role="button" tabindex="0">${spriteImg(p)}</span>` : `<span class="slot sm empty"></span>`;
  const names = mons.filter(Boolean);
  el.innerHTML = `<span class="duo">${mons.map((p, i) => (i ? `<u style="--l:${col(i - 1)};--r:${col(i)}"></u>` : "") + slot(p, i)).join("")}</span><span class="tt"><b>${names.map(p => esc(label(p))).join(` ${t().and} `)}</b><small>${esc(sub)}</small></span>`;
  el.title = names.map(species).join(` ${t().and} `);
}

/* ---------- Pokémon card: moves, item, ability, nature, stats, learnset */
// Names and texts come from each player's own ROM, since a randomizer changes them.
const dexes = new Map();
let cardSel = null;
const STATS = ["attack", "defense", "speed", "sp_attack", "sp_defense"];

function findMon(seat, pid) {
  const pl = state && state.players[seat], snap = pl && pl.snapshot;
  const own = snap && [...snap.party, ...snap.boxes].find(p => p.pid === pid);
  if (own) return own;
  for (const l of state ? state.links : []) { const s = l.sides[seat]; if (s && s.pokemon.pid === pid) return s.pokemon; }
  return null;
}

// undefined while loading, null if this player's ROM sent none.
function dexFor(seat) {
  const pl = state.players[seat];
  if (DEMO) return window.SoulSyncDemoDex || null;
  if (!pl || !pl.dex) return null;
  const key = [state.code, pl.name, state.attempt || 1].join("|");
  let d = dexes.get(key);
  if (!d) {
    d = { data: undefined };
    dexes.set(key, d);
    fetch(`${SRV}/api/runs/${encodeURIComponent(state.code)}/dex?player=${encodeURIComponent(pl.name)}`)
      .then(r => r.ok ? r.json() : null).catch(() => null)
      .then(x => { d.data = x; updateCard(); });
  }
  return d.data;
}

function openCard(seat, pid) {
  cardSel = { seat, pid };
  const dlg = $("#mon");
  dlg._sig = ""; dlg.scrollTop = 0;
  if (!dlg.open) dlg.showModal();
  updateCard();
}

const CATS = ["physical", "special", "status"];
function moveRow(mv, info, pp, max) {
  const c = t().mon;
  if (!info) return `<div class="mvr"><span></span><span class="mn"><b>${esc(c.moveN(mv))}</b></span><span></span><span class="n dim">–</span><span class="n dim">–</span><span class="n">${pp != null ? pp + (max ? "/" + max : "") : ""}</span></div>`;
  const cat = CATS.includes(info.category) ? `<span class="ci ${info.category}" title="${esc(c.cat[info.category])}">${ICON[info.category]}</span>` : "<span></span>";
  const pow = info.power > 1 ? info.power : null, acc = info.accuracy && info.accuracy <= 100 ? info.accuracy : null;
  const prio = info.priority ? `${c.prio} ${info.priority > 0 ? "+" : ""}${info.priority}  ·  ` : "";
  const low = max && pp * 4 <= max;
  return `<div class="mvr">${info.type ? tyChip(info.type) : "<span></span>"}<span class="mn"><b>${esc(info.name)}</b><small title="${esc(info.text || "")}">${esc(prio + (info.text || ""))}</small></span>${cat}<span class="n${pow ? "" : " dim"}">${pow || "–"}</span><span class="n${acc ? "" : " dim"}">${acc || "–"}</span><span class="n${low ? " low" : ""}">${pp}${max ? "/" + max : ""}</span></div>`;
}

function cardHtml(seat, p, dex) {
  const c = t().mon, b = p.battle, pl = state.players[seat];
  const info = id => dex && dex.moves[id];
  const ail = p.ailment && t().ail[p.ailment] ? `<span class="ail">${esc(t().ail[p.ailment])}</span>` : "";
  const entry = (list, id) => dex && list && list[id] ? list[id] : null;
  const item = p.item ? entry(dex && dex.items, p.item) : null, ab = entry(dex && dex.abilities, p.ability);
  const up = Math.floor(p.nature / 5), down = p.nature % 5;
  const natFx = up === down ? `<small>${c.neutral}</small>` : `<div class="nat"><span class="up">${ICON.up}${esc(c.st[STATS[up]])}</span><span class="dn">${ICON.dn}${esc(c.st[STATS[down]])}</span></div>`;
  // The partner of this Pokémon in its link, to switch to.
  const link = state.links.find(l => l.sides[seat] && l.sides[seat].pokemon.pid === p.pid);
  const partners = link ? link.sides.map((s, j) => s && j !== seat ? [s, j] : null).filter(Boolean) : [];
  const partner = partners.map(([s, j]) => `<button type="button" class="partner" style="--pc:${col(j)}" data-mon="${s.pokemon.pid}" data-seat="${j}"><span class="slot">${spriteImg(s.pokemon)}</span><span><small>${c.linked}${esc(seatName(j))}</small><b>${esc(label(s.pokemon))}${s.pokemon.battle ? `  ·  ${t().lv} ${s.pokemon.battle.level}` : ""}</b></span></button>`).join("");
  const fx = (k, body) => `<div class="fx"><span>${k}</span>${body}</div>`;
  const facts = `<div class="facts3">
    ${fx(c.item, `<b>${item || p.item ? itemImg(p.item) : ""}${esc(item ? item.name : p.item ? "#" + p.item : c.none)}</b>${item && item.text ? `<small>${esc(item.text)}</small>` : ""}`)}
    ${fx(c.nature, `<b>${esc(c.natures[p.nature] || "#" + p.nature)}</b>${natFx}`)}
    ${fx(c.ability, `<b>${esc(ab ? ab.name : "#" + p.ability)}</b>${ab && ab.text ? `<small>${esc(ab.text)}</small>` : ""}`)}
    ${partner ? `<div class="fx" style="padding:6px;display:flex;flex-direction:column;gap:6px">${partner}</div>` : ""}
  </div>`;
  const head = `<header class="dh" style="--c:${col(seat)}"><button type="button" class="x" data-close aria-label="${c.close}"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="dstage">${spriteImg(p)}</div>
    <div class="did"><p class="who"><i></i>${esc(pl ? pl.name : seatName(seat))}  ·  ${esc(c.met(p.met_location_name ? nameOf(p.met_location_name) : "#" + p.met_location, p.met_level))}</p>
      <h2>${esc(label(p))}${b ? `<small>${t().lv} ${b.level}</small>` : ""}</h2>
      ${p.is_nicknamed ? `<div class="spc">${esc(species(p))}</div>` : ""}
      <div class="tys">${(p.types || []).map(tyChip).join("")}${ail}</div>
      ${b ? hpLine(b) : ""}</div>
    ${p.moves && p.moves.length ? facts : ""}</header>`;

  let note = "";
  if (dex === undefined) note = `<p class="mon-note">${c.loading}</p>`;
  else if (!dex) note = `<p class="mon-note">${c.noDex}</p>`;
  if (!p.moves || !p.moves.length) return head + `<p class="mon-note" style="padding-bottom:22px">${c.noMoves}</p>`;

  const known = new Set(p.moves.map(m => m.id));
  const moves = `<h3>${c.moves}</h3><div class="mvl"><div class="mvr hd"><span>${c.type}</span><span>${c.name}</span><span></span><span>${c.pow}</span><span>${c.accShort}</span><span>${c.pp}</span></div>${p.moves.map(m => {
    const i = info(m.id), max = i ? Math.floor(i.pp * (5 + m.pp_ups) / 5) : null;
    return moveRow(m.id, i, m.pp, max);
  }).join("")}</div>`;

  let learn = "";
  const ls = dex && dex.learnsets && dex.learnsets[p.species - 1];
  if (ls && ls.length) {
    const lv = b ? b.level : 0, nextLv = (ls.find(([l]) => l > lv) || [])[0];
    const row = ([l, id]) => {
      const i = info(id), cls = known.has(id) ? "has" : l <= lv ? "past" : l === nextLv ? "next" : "";
      return `<div class="lsr ${cls}"><span class="l">${t().lv} ${l || "–"}</span><b>${esc(i ? i.name : c.moveN(id))}</b>${l === nextLv && !known.has(id) ? `<span class="nx">${c.next}</span>` : known.has(id) ? `<span class="nx" style="color:var(--muted)">${c.knows}</span>` : i && i.type ? tyChip(i.type) : "<span></span>"}</div>`;
    };
    // Coming moves first, then those already passed.
    const ahead = ls.filter(([l, id]) => l > lv && !known.has(id)), behind = ls.filter(x => !ahead.includes(x));
    learn = `<h3 class="gap">${c.learn}<em>${c.nextFirst}</em></h3><div>${ahead.concat(behind).map(row).join("")}</div>`;
  }

  let stats = "";
  if (p.stats && b) {
    const all = [b.max_hp, ...STATS.map(k => p.stats[k])], mx = Math.max(60, ...all) * 1.05;
    const row = (k, v, cls) => `<span class="${cls}">${esc(k)}${cls ? ICON[cls] : ""}</span><b>${v}</b><i style="--w:${(v / mx * 100).toFixed(0)}%"></i>`;
    stats = `<h3>${c.stats}<em>${c.total} ${all.reduce((a, x) => a + x, 0)}</em></h3><div class="sts">${row(c.hp, b.max_hp, "")}${STATS.map((k, i) => row(c.st[k], p.stats[k], up === down ? "" : i === up ? "up" : i === down ? "dn" : "")).join("")}</div>`;
  } else stats = `<h3>${c.stats}</h3><p class="mon-note">${c.noStats}</p>`;
  return head + note + `<div class="db"><section>${moves}${learn}</section><section>${stats}</section></div>`;
}

// Full rows where stats matter (open, team); compact tiles for box and lost.
function updateLinks() {
  const ms = model();
  const before = new Map();
  rows.forEach((el, k) => before.set(k, el.getBoundingClientRect()));
  const seen = new Set();
  let fresh = 0;
  for (const m of ms) {
    m.home = m.sec;
    const el = rows.get(m.key);
    if (!el) continue;
    // A link that just died stays in place while the tether snaps, then moves to Lost.
    if (el._kind === "row" && m.sec === "lost") {
      m.home = el._home;
      if (!el._dying) {
        el._dying = true; el.classList.add("leaving");
        setTimeout(() => { if (rows.get(m.key) === el) rows.delete(m.key); el.remove(); if (state && mounted) updateLinks(); }, 1300);
      }
    } else if ((el._kind === "tile") !== !!TILED[m.sec]) { rows.delete(m.key); el.remove(); }
  }
  for (const sec of SECTIONS) {
    const box = $(`.sec[data-sec=${sec}]`), list = box.lastElementChild, mine = ms.filter(m => m.home === sec);
    box.hidden = !mine.length;
    $("em", box).textContent = ms.filter(m => m.sec === sec).length;
    mine.forEach((m, idx) => {
      seen.add(m.key);
      let el = rows.get(m.key);
      const isNew = !el;
      if (isNew) { el = TILED[sec] ? newTile() : newRow(); el.style.setProperty("--i", Math.min(fresh++, 12)); rows.set(m.key, el); }
      el._home = sec;
      if (list.children[idx] !== el) list.insertBefore(el, list.children[idx] || null);
      if (el._kind === "tile") patchTile(el, m); else patchRow(el, m, isNew);
    });
  }
  rows.forEach((el, k) => { if (!seen.has(k)) { rows.delete(k); el.remove(); } });
  rows.forEach((el, k) => {
    const r = before.get(k); if (!r) return;
    const n = el.getBoundingClientRect(), dx = r.left - n.left, dy = r.top - n.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: "none" }], { duration: 480, easing: OUT });
  });
  $("#none").hidden = ms.length > 0 || state.players.length < seats();
  const n = s => ms.filter(m => m.sec === s).length;
  $("#sum").innerHTML = t().sum(n("team") + n("boxed"), n("open"), n("lost"));
}

/* ---------- type chart (generations 2 to 5) */
const TYPES = ["normal", "fire", "water", "electric", "grass", "ice", "fighting", "poison", "ground", "flying", "psychic", "bug", "rock", "ghost", "dragon", "dark", "steel"];
const TCOL = { normal: "#A8A77A", fire: "#EE8130", water: "#6390F0", electric: "#F7D02C", grass: "#7AC74C", ice: "#96D9D6", fighting: "#C22E28", poison: "#A33EA1", ground: "#E2BF65", flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A", rock: "#B6A136", ghost: "#735797", dragon: "#6F35FC", dark: "#705746", steel: "#B7B7CE" };
const CHART = (() => {
  const raw = {
    normal: ["", "rock steel", "ghost"], fire: ["grass ice bug steel", "fire water rock dragon", ""], water: ["fire ground rock", "water grass dragon", ""],
    electric: ["water flying", "electric grass dragon", "ground"], grass: ["water ground rock", "fire grass poison flying bug dragon steel", ""],
    ice: ["grass ground flying dragon", "fire water ice steel", ""], fighting: ["normal ice rock dark steel", "poison flying psychic bug", "ghost"],
    poison: ["grass", "poison ground rock ghost", "steel"], ground: ["fire electric poison rock steel", "grass bug", "flying"],
    flying: ["grass fighting bug", "electric rock steel", ""], psychic: ["fighting poison", "psychic steel", "dark"],
    bug: ["grass psychic dark", "fire fighting poison flying ghost steel", ""], rock: ["fire ice flying bug", "fighting ground steel", ""],
    ghost: ["psychic ghost", "dark steel", "normal"], dragon: ["dragon", "steel", ""], dark: ["psychic ghost", "fighting dark steel", ""],
    steel: ["ice rock", "fire water electric steel", ""],
  };
  const out = {};
  for (const [a, [se, nve, no]] of Object.entries(raw)) {
    out[a] = {};
    se.split(" ").filter(Boolean).forEach(d => { out[a][d] = 2; });
    nve.split(" ").filter(Boolean).forEach(d => { out[a][d] = .5; });
    no.split(" ").filter(Boolean).forEach(d => { out[a][d] = 0; });
  }
  return out;
})();
const eff = (a, d) => CHART[a][d] ?? 1;
let tRow = null, tCol = null;

function updateTypes() {
  const el = $("#types");
  if (el._sig !== lang) {
    el._sig = lang;
    const mark = x => x === 2 ? "2" : x === .5 ? "½" : x === 0 ? "0" : "";
    el.innerHTML = `<p>${t().tLead}</p>
      <div class="tgrid"><span></span>${TYPES.map((d, c) => `<button type="button" class="ch" data-c="${c}" style="--tc:${TCOL[d]}" title="${esc(typeName(d))}"><i></i>${esc(typeName(d).slice(0, 3))}</button>`).join("")}
      ${TYPES.map((a, r) => `<button type="button" class="rh" data-r="${r}" style="--tc:${TCOL[a]}"><i></i>${esc(typeName(a))}</button>` + TYPES.map((d, c) => { const x = eff(a, d); return `<span class="tc ${x === 2 ? "se" : x === .5 ? "nve" : x === 0 ? "no" : ""}" data-r="${r}" data-c="${c}">${mark(x)}</span>`; }).join("")).join("")}</div>
      <p class="tleg"><span><b class="se">2</b>${t().tSe}</span><span><b class="nve">½</b>${t().tNve}</span><span><b class="no">0</b>${t().tNo}</span></p>`;
    const grid = $(".tgrid", el);
    grid.onclick = e => {
      const x = e.target.closest("[data-r],[data-c]");
      if (!x) tRow = tCol = null;
      else if (x.classList.contains("tc")) {
        const same = tRow === +x.dataset.r && tCol === +x.dataset.c;
        tRow = same ? null : +x.dataset.r; tCol = same ? null : +x.dataset.c;
      }
      else if (x.dataset.r != null) tRow = tRow === +x.dataset.r ? null : +x.dataset.r;
      else tCol = tCol === +x.dataset.c ? null : +x.dataset.c;
      paintTypes();
    };
    grid.onmouseover = e => {
      const c = e.target.closest(".tc");
      grid.querySelectorAll(".hi").forEach(x => x.classList.remove("hi"));
      if (c) grid.querySelectorAll(`.rh[data-r="${c.dataset.r}"],.ch[data-c="${c.dataset.c}"]`).forEach(x => x.classList.add("hi"));
    };

function paintTypes() {
  const grid = $("#types .tgrid");
  grid.classList.toggle("focus", tRow != null || tCol != null);
  for (const x of grid.children) {
    const r = x.dataset.r != null ? +x.dataset.r : null, c = x.dataset.c != null ? +x.dataset.c : null;
    if (x.classList.contains("tc")) {
      x.classList.toggle("on", r === tRow || c === tCol);
      x.classList.toggle("x", r === tRow && c === tCol);
    } else if (r != null || c != null) {
      const sel = r != null ? r === tRow : c === tCol;
      x.classList.toggle("sel", sel); x.setAttribute("aria-pressed", sel);
    }
  }
}

/* ---------- catch chance (generation 5) */
const BALLS = [1, 1.5, 2, 5, 3.5];
const catchUi = { list: null, fromRom: false, sp: null, hp: 100, status: 0, grass: false, loaded: null };

// Chance per throw. `hp` is the remaining share of HP, `caught` the number of
// species owned, which decides critical captures and the dark grass penalty.
function catchChance(rate, hp, status, ball, grass, caught) {
  const tier = caught > 600 ? 5 : caught > 450 ? 4 : caught > 300 ? 3 : caught > 150 ? 2 : caught > 30 ? 1 : 0;
  const g = grass ? [1229, 2048, 2867, 3277, 3686, 4096][tier] / 4096 : 1;
  const x = (1 - 2 * hp / 3) * g * rate * ball * [1, 1.5, 2.5][status];
  if (x >= 255) return 1;
  const y = Math.floor(65536 / Math.pow(255 / x, .25)) / 65536;
  const crit = Math.floor(Math.min(255, x) * [0, .5, 1, 1.5, 2, 2.5][tier] / 6) / 256;
  return crit * y + (1 - crit) * y ** 3;
}

function caughtCount() {
  return Math.max(0, ...state.players.map(p => p.snapshot ? new Set([...p.snapshot.party, ...p.snapshot.boxes].filter(m => !m.is_egg).map(m => m.species)).size : 0));
}

function mountCatch() {
  const el = $("#catch"), u = catchUi;
  el.innerHTML = `<h2>${t().cTitle}<small id="crate"></small></h2>
    <div class="clive" id="clive" hidden></div>
    <input class="cin" id="cin" type="text" autocomplete="off" spellcheck="false" placeholder="${t().cFind}" aria-label="${t().cFind}" value="${u.sp ? esc(u.sp[lang === "de" ? 1 : 0]) : ""}">
    <div class="clist" id="clist" hidden></div>
    <div class="crow"><span>${t().cHp}</span><input type="range" id="chp" min="1" max="100" value="${u.hp}" aria-label="${t().cHp}"><output id="chpo"></output></div>
    <div class="crow"><span>${t().cStatus}</span><div class="seg3" id="cst">${[t().cNone, t().cMinor, t().cMajor].map((x, i) => `<button type="button" data-s="${i}">${x}</button>`).join("")}</div></div>
    <div class="crow"><label><input type="checkbox" id="cgr" ${u.grass ? "checked" : ""}>${t().cGrass}</label></div>
    <div class="cres" id="cres">${t().balls.map(([n, note]) => `<span>${n}${note ? `<small>${note}</small>` : ""}</span><b></b><u><i></i></u>`).join("")}</div>`;
  const input = $("#cin"), list = $("#clist");
  let cur = 0, hits = [];
  const close = () => { list.hidden = true; };
  const choose = sp => { u.sp = sp; input.value = sp[lang === "de" ? 1 : 0]; close(); updateCatch(); };
  const search = () => {
    const q = input.value.trim().toLowerCase(), k = lang === "de" ? 1 : 0;
    const all = u.list || [];
    hits = q ? [...all.filter(sp => sp[k].toLowerCase().startsWith(q)), ...all.filter(sp => !sp[k].toLowerCase().startsWith(q) && sp[k].toLowerCase().includes(q))].slice(0, 6) : [];
    cur = 0; list.hidden = !hits.length;
    list.innerHTML = hits.map((sp, i) => `<button type="button" data-i="${i}" class="${i ? "" : "cur"}"><span>${esc(sp[k])}</span><small>${sp[2]}</small></button>`).join("");
  };
  input.oninput = () => { u.sp = null; search(); updateCatch(); };
  input.onfocus = () => { input.select(); };
  input.onkeydown = e => {
    if (e.key === "Escape") { close(); return; }
    if (!hits.length || list.hidden) return;
    if (e.key === "Enter") { e.preventDefault(); choose(hits[cur]); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); cur = (cur + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
      [...list.children].forEach((b, i) => b.classList.toggle("cur", i === cur));
    }
  };
  input.onblur = () => setTimeout(close, 150);
  list.onmousedown = e => { const b = e.target.closest("button"); if (b) { e.preventDefault(); choose(hits[+b.dataset.i]); } };
  $("#chp").oninput = e => { u.hp = +e.target.value; updateCatch(); };
  $("#cst").onclick = e => { const b = e.target.closest("button"); if (b) { u.status = +b.dataset.s; updateCatch(); } };
  $("#cgr").onchange = e => { u.grass = e.target.checked; updateCatch(); };
}

function loadSpecies() {
  const u = catchUi, key = state.code + "|" + !!state.rom_data;
  if (u.loaded === key) return;
  u.loaded = key;
  const take = d => {
    u.list = d.species; u.fromRom = !!d.from_rom;
    if (u.sp) u.sp = u.list.find(sp => sp[0] === u.sp[0]) || null;
    updateCatch();
    if (state && mounted) updatePlayers();
  };
  if (window.SoulSyncDemoSpecies) take(window.SoulSyncDemoSpecies);
  else fetch(`${SRV}/api/runs/${encodeURIComponent(state.code)}/species`).then(r => r.json()).then(take).catch(() => { u.loaded = null; });
}

function updateCatch() {
  if (!$("#cres")) return;
  loadSpecies();
  followWild();
  const u = catchUi, hp = u.hp;
  $("#chpo").textContent = hp + " %";
  $("#chp").style.setProperty("--hpc", `var(--${hp > 50 ? "ok" : hp > 20 ? "warn" : "danger"})`);
  $("#cst").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.s === u.status));
  $("#crate").textContent = u.sp ? `${t().cRate(u.sp[2])}  ·  ${u.fromRom ? t().cRom : t().cStd}` : "";
  const res = $("#cres"), caught = caughtCount();
  res.classList.toggle("off", !u.sp);
  BALLS.forEach((ball, i) => {
    const p = u.sp ? catchChance(u.sp[2], hp / 100, u.status, ball, u.grass, caught) : 0;
    const pct = p * 100;
    res.children[i * 3 + 1].textContent = u.sp ? (pct >= 99.95 ? "100" : pct < 10 ? pct.toFixed(1) : Math.round(pct)) + " %" : "–";
    const bar = res.children[i * 3 + 2].firstChild;
    bar.style.width = pct + "%";
    bar.style.background = `var(--${pct >= 50 ? "ok" : pct >= 20 ? "warn" : "danger"})`;
  });
}


// The wild Pokémon a player faces right now, from the Lua script: in the app
// your own, otherwise whoever has one.
// Only the viewer's own battle drives the calculator; the others' battles
// show on their player cards.
function wildNow() {
  const p = local && state.players.find(p => p.name === local.name && p.snapshot && p.snapshot.wild);
  return p ? { player: p.name, mon: p.snapshot.wild } : null;
}


// Keeps the catch chance on the wild Pokémon of the battle: species, HP and
// status follow it. Between battles the fields are the viewer's again.
function followWild() {
  const u = catchUi, w = wildNow(), box = $("#clive");
  if (!box) return;
  box.hidden = !w;
  if (!w) { u.live = null; return; }
  const m = w.mon, b = m.battle || { hp: 1, max_hp: 1, level: "?" };
  const sig = [m.pid, b.hp, b.max_hp, m.ailment, lang, u.list && u.list.length].join("|");
  if (u.live === sig) return;
  u.live = sig;
  box.innerHTML = `<i class="dot live"></i><span><b>${esc(species(m))}</b> ${t().lv} ${b.level}  ·  ${b.hp}/${b.max_hp} ${t().cHp}${m.ailment ? "  ·  " + t().ail[m.ailment] : ""}</span><small>${esc(w.player)}</small>`;
  const sp = (u.list || []).find(x => x[0] === (m.species_name && m.species_name.en));
  if (sp) { u.sp = sp; $("#cin").value = sp[lang === "de" ? 1 : 0]; }
  u.hp = Math.max(1, Math.min(100, Math.round(100 * b.hp / (b.max_hp || 1))));
  $("#chp").value = u.hp;
  u.status = !m.ailment ? 0 : m.ailment === "sleep" || m.ailment === "freeze" ? 2 : 1;
}

function gameOf(p) { const g = p && p.snapshot && p.snapshot.trainer.game; return g ? t().games[g] || g : null; }

// The hero of the overview, the badges, the players in the bar and their
// live cards: who is in a battle right now, and with what chance.
function updatePlayers() {
  const cap = capNow(), n = seats();
  document.documentElement.style.setProperty("--n", n);
  const word = t().kAttempt, num = state.attempt || 1;
  $("#title").innerHTML = `${esc(word)} <span>${num}</span>`;
  const av = $("#avatars");
  if (av) av.innerHTML = seatList().map(i => { const p = state.players[i]; return `<span class="av${p && p.connected ? "" : " off"}" style="--c:${col(i)}" title="${esc(seatName(i))}${p && p.connected ? "" : "  ·  " + t().away}">${esc(seatName(i).slice(0, 1).toUpperCase())}</span>`; }).join("");

  // Badges of each player, and how close the strongest Pokémon is to the cap.
  const orden = $("#orden");
  const withSave = state.players.filter(p => p.snapshot), least = withSave.length ? Math.min(...withSave.map(p => p.snapshot.trainer.badges)) : 0;
  const top = Math.max(0, ...state.players.flatMap(p => p.snapshot ? p.snapshot.party.filter(m => m.battle).map(m => m.battle.level) : []));
  if (!orden.firstChild || orden._n !== n || orden._lang !== lang) {
    orden._n = n; orden._lang = lang;
    orden.innerHTML = `<h4>${t().badgesT}<b id="obadge"></b></h4>${seatList().map(i => `<div class="orow" style="--c:${col(i)}"><span><i></i>${esc(seatName(i))}</span>${"<i class=\"badge\"></i>".repeat(8)}</div>`).join("")}<div class="capbar" id="capbar"><span>${t().kCap}</span><span class="bar"><i></i></span><b></b></div>`;
  }
  $("#obadge").textContent = `${least} / 8`;
  orden.querySelectorAll(".orow").forEach((row, i) => {
    const p = state.players[i], badges = p && p.snapshot ? p.snapshot.trainer.badges : 0;
    $("span", row).lastChild.textContent = seatName(i);
    row.querySelectorAll(".badge").forEach((d, k) => {
      const on = k < badges;
      if (on && !d.classList.contains("on") && row._seen) once(d, "pop");
      d.classList.toggle("on", on);
    });
    if (p && p.snapshot) row._seen = true;
  });
  const cb = $("#capbar");
  cb.hidden = cap == null;
  if (cap != null) {
    const bar = $(".bar i", cb);
    bar.style.setProperty("--w", Math.min(100, top / cap * 100).toFixed(0) + "%");
    bar.classList.toggle("over", top > cap);
    $("b", cb).textContent = cap;
    cb.title = `${t().lv} ${top} / ${cap}`;
  }

  // One card per player.
  const box = $("#pcards");
  if (box._n !== n) { box._n = n; box.innerHTML = seatList().map(i => `<article class="pcard reveal" style="--c:${col(i)};--i:${i}"></article>`).join(""); }
  $("#livesrc").textContent = local && local.live ? t().liveSrc : "";
  box.querySelectorAll(".pcard").forEach((el, i) => {
    const p = state.players[i], w = p && p.snapshot && p.snapshot.wild;
    const secs = p && p.updated_at ? Math.max(0, (Date.now() - p.updated_at) / 1000) : null;
    const meta = !p ? t().notJoined : [gameOf(p), p.connected ? null : t().away, secs == null ? t().never : `${t().saved} ${t().ago(secs)}`].filter(Boolean).join("  ·  ");
    const st = !p || !p.connected ? `<span class="state away">${t().offlineP}</span>` : w ? `<span class="state fight">${t().inBattle}</span>` : `<span class="state">${t().exploring}</span>`;
    const head = `<div class="pch"><i></i><b>${esc(seatName(i))}</b>${st}</div><p class="meta">${esc(meta)}</p>`;
    const sig = [lang, head, w ? [w.pid, w.species, w.battle && w.battle.hp, w.battle && w.battle.max_hp, w.ailment, (catchUi.list || []).length, caughtCount()].join() : "", local && local.art, !!sprites].join("|");
    if (el._sig === sig) return;
    const sameMon = el._pid && w && el._pid === w.pid;
    el._sig = sig; el._pid = w ? w.pid : null;
    el.classList.toggle("fight", !!w);
    el.classList.toggle("off", !p || !p.connected);
    if (!w) { el.innerHTML = head + `<p class="idle">${p ? t().idleWild(esc(seatName(i))) : esc(t().waitPlayer(i + 1))}</p>`; return; }
    const b = w.battle || { hp: 1, max_hp: 1, level: "?" }, r = b.max_hp ? b.hp / b.max_hp : 1;
    const sp = (catchUi.list || []).find(x => x[0] === (w.species_name && w.species_name.en));
    const status = !w.ailment ? 0 : w.ailment === "sleep" || w.ailment === "freeze" ? 2 : 1;
    const chance = ball => sp ? catchChance(sp[2], r, status, ball, false, caughtCount()) * 100 : null;
    const fmt = x => x == null ? "–" : (x >= 99.95 ? "100" : x < 10 ? x.toFixed(1) : Math.round(x)) + "%";
    const three = [0, 1, 2].map(k => [t().balls[k][0], chance(BALLS[k])]);
    const best = three.reduce((a, x, k) => x[1] != null && (a < 0 || x[1] > three[a][1] + .05) ? k : a, -1);
    const ring = best < 0 ? null : three[best];
    const html = head + `<div class="wild2"><span class="stage">${spriteImg(w)}</span>
      <div class="info"><div class="wnm"><b>${esc(species(w))}</b><span>${t().lv} ${b.level}  ·  ${t().wild}</span></div><div class="tys">${(w.types || []).map(tyChip).join("")}</div>
      <div class="hpl"><span class="bar"><i style="--w:${(r * 100).toFixed(0)}%;--hc:var(--${r < .35 ? "danger" : r < .6 ? "warn" : "ok"})"></i></span>${Math.round(r * 100)} %${w.ailment ? `<span class="ail">${esc(t().ail[w.ailment])}</span>` : ""}</div></div>
      <div class="ring" style="--p:${ring ? Math.min(100, ring[1]).toFixed(0) : 0}" title="${esc(t().wildTip)}"><div><b>${ring ? fmt(ring[1]) : "–"}</b><small>${ring ? esc(ring[0]) : ""}</small></div></div></div>
      <div class="balls">${three.map(([nm, x], k) => `<span class="${k === best ? "best" : ""}">${esc(nm)}<b>${fmt(x)}</b></span>`).join("")}</div>`;
    if (sameMon) {
      // The same battle: only the numbers change, the sprite keeps bobbing.
      const tmp = document.createElement("div"); tmp.innerHTML = html;
      for (const sel of [".pch", ".meta", ".hpl", ".ring", ".balls"]) { const a = $(sel, el), z = $(sel, tmp); if (a && z) a.replaceWith(z); }
    } else el.innerHTML = html;
  });
}

function updateStatus() {
  const el = $("#status"); if (!el) return;
  const live = state ? state.players.filter(p => p.connected).length : 0;
  el.className = "status" + (conn === "missing" ? " bad" : conn === "live" && live ? " live" : "");
  $("span", el).textContent = conn === "missing" ? t().missing : conn !== "live" ? t().offline : !live ? t().live0 : live >= seats() ? t().liveAll(live) : t().liveSome(live, seats());
}

function syncCmd() {
  const server = location.origin.startsWith("http://localhost:3000") ? "" : ` --server ${location.origin}`;
  return `soulsync sync ${t().yourSave} --code ${state.code} --name ${t().yourName}${server}`;
}

function updateSetup() {
  const el = $("#setup"), need = state.players.length < seats() && !DEMO;
  if (!need) { el.innerHTML = ""; el._on = false; return; }
  const sig = lang + "|" + (local ? "a" + (local.server || "") : "w");
  if (el._on === sig) return;
  el._on = sig;
  const code = `<div class="cmd"><code class="mono">${esc(state.code)}</code><button type="button">${t().copy}</button></div>`;
  el.innerHTML = local
    ? `<div class="setup"><h3>${t().setup}</h3><ol><li>${t().aStep1}</li><li>${t().aStep2}${code}</li>${local.server ? `<li>${t().aStep3(esc(local.server))}</li>` : ""}</ol>${local.server ? "" : `<p class="lead" style="margin:10px 0 0;font-size:13px">${t().aLocal}</p>`}</div>`
    : `<div class="setup"><h3>${t().setup}</h3><ol><li>${t().step1}</li><li>${t().step2}<div class="cmd"><code>${esc(syncCmd())}</code><button type="button">${t().copy}</button></div></li><li>${t().step3}</li></ol></div>`;
  $(".cmd button", el).onclick = e => copyText(local ? state.code : syncCmd(), e.currentTarget);
}

function updateRail() {
  const games = [...new Set(state.players.map(gameOf).filter(Boolean))];
  const seeds = state.seeds && state.seeds.length ? state.seeds : [state.seed];
  const shared = state.settings.shared_seed || seeds.length < 2;
  const chip = (v, hl) => `<span class="tag${hl ? " hl" : ""}">${v}</span>`;
  const html = [chip(t().soulLink(seats()), true), games.length ? chip(`Pokémon ${esc(games.join(" / "))}  ·  ${t().gen(5)}`) : "", seeds[0] != null ? chip(shared ? `${t().kSeed} <span class="mono">${esc(seeds[0])}</span>` : t().seedOwn) : ""].join("");
  const el = $("#chips");
  if (el._h !== html) { el._h = html; el.innerHTML = html; el.title = shared ? "" : seeds.map((v, i) => `${seatName(i)}: ${v}`).join("\n"); }
  updateActions();
  updateFeed();
}
// Continue playing and start over, where the app can do it.
function updateActions() {
  const el = $("#actions"); if (!el) return;
  const can = local && local.play, fresh = local && local.fresh;
  const sig = [lang, can, !!fresh].join("|");
  if (el._sig === sig) return;
  el._sig = sig;
  el.hidden = !can && !fresh;
  el.innerHTML = `${can ? `<button type="button" class="play" id="play">${ICON.play}<span>${t().play}<small>${t().playSub}</small></span></button>` : ""}
    ${fresh ? `<button type="button" class="sq retry" id="gofresh" aria-label="${t().fresh}">${ICON.retry}<span class="tip">${t().fresh}</span></button>` : ""}
    <button type="button" class="sq" id="gotypes" aria-label="${t().tabs.types}">${ICON.types}<span class="tip">${t().tabs.types}</span></button>`;
  const play = $("#play", el);
  if (play) play.onclick = async () => {
    play.disabled = true;
    const r = await localPost("play").catch(() => null);
    $("small", play).textContent = r && r.ok ? t().playOk : t().playFail;
    setTimeout(() => { play.disabled = false; $("small", play).textContent = t().playSub; }, 4000);
  };
  const go = (v, then) => { view = v; try { history.replaceState(null, "", "#" + v); } catch {} showView(); if (then) nextFrame(then); };
  const gf = $("#gofresh", el);
  if (gf) gf.onclick = () => go("settings", () => { const s = $("#freshsec"); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); });
  $("#gotypes", el).onclick = () => go("types");
}

function partnerOf(p, player) {
  const i = state.players.findIndex(x => x.name === player);
  const l = state.links.find(x => x.location === p.met_location);
  const others = l ? l.sides.filter((o, j) => j !== i && o).map(o => label(o.pokemon)) : [];
  return others.length ? others.join(` ${t().and} `) : null;
}

function eventHtml(e) {
  const x = t(), ev = e.event, p = ev.pokemon, m = p && esc(label(p));
  switch (ev.type) {
    case "caught": { const o = partnerOf(p, e.player); return x.evCaught(esc(e.player), m, esc(nameOf(p.met_location_name, "#" + p.met_location))) + (o ? x.evLinked(esc(o)) : ""); }
    case "fainted": { const o = partnerOf(p, e.player); return x.evFainted(m) + (o ? x.evLost(esc(o)) : ""); }
    case "evolved": return x.evEvolved(m, esc(species(p)));
    case "level_up": return x.evLevel(m, p.battle ? p.battle.level : "?");
    case "moved": return p.place.kind === "party" ? x.evParty(m) : x.evBox(m, p.place.box);
    case "gone": return x.evGone(m);
    case "encountered": return x.evMet(esc(e.player), esc(species(p)), esc(nameOf(p.met_location_name, "#" + p.met_location)));
    case "badges": return x.evBadges(esc(e.player), ev.count);
    default: return esc(ev.type);
  }
}

function updateFeed() {
  const box = $("#feed"), first = feed.size === 0;
  const keys = state.log.map(e => [e.at, e.player, e.event.type, e.event.pokemon ? e.event.pokemon.pid : e.event.count].join("|"));
  const want = new Set(keys);
  feed.forEach((el, k) => { if (!want.has(k)) { feed.delete(k); el.remove(); } });
  for (let i = state.log.length - 1; i >= 0; i--) {
    const k = keys[i];
    if (feed.has(k)) continue;
    const el = document.createElement("div"), [g, c] = evIcon(state.log[i]);
    el.className = "ev" + (first ? "" : " new");
    el.innerHTML = `<div><i class="evi" style="--c:${c}">${g}</i><p>${eventHtml(state.log[i])}<time data-at="${state.log[i].at}"></time></p></div>`;
    box.prepend(el); feed.set(k, el);
    if (!first) nextFrame(() => el.classList.remove("new"));
  }
  $("#nofeed").hidden = state.log.length > 0;
  tick();
}

function tick() {
  document.querySelectorAll(".ev time").forEach(el => { el.textContent = t().short(Math.max(0, (Date.now() - +el.dataset.at) / 1000)); });
}

// Linked pairs in the team, then those resting in the box.
function updateTeam() {
  const ms = model(), n = seats();
  const sig = JSON.stringify([lang, n, ms.filter(m => m.sec === "team" || m.sec === "boxed").map(m => [m.sec, m.sides.map(s => s && [s.pokemon.pid, s.pokemon.species, s.pokemon.nickname, s.pokemon.battle, s.status])]), local && local.art, !!sprites]);
  const el = $("#team");
  if (el._sig === sig) return;
  el._sig = sig;
  const mon = (s, i) => {
    if (!s) return `<div class="tm empty">${esc(t().waitPlayer(i + 1))}</div>`;
    const p = s.pokemon, b = p.battle, r = b && b.max_hp ? b.hp / b.max_hp : 0;
    const tys = (p.types || []).map(tyChip).join("");
    return `<div class="tm" style="--c:${col(i)}" data-mon="${p.pid}" data-seat="${i}" role="button" tabindex="0" title="${esc(t().mon.open)}"><span class="stage">${spriteImg(p)}</span><b>${esc(label(p))}</b><small>${esc(species(p))}${b ? `  ·  ${t().lv} ${b.level}` : `  ·  ${t().box(p.place.box ?? "")}`}</small><div class="tys">${tys}</div>${b ? hpLine(b) : ""}</div>`;
  };
  const card = (m, k) => `<article class="pairc glass reveal${n > 2 ? " multi" : ""}" style="--n:${n};--i:${Math.min(k, 10)}"><span class="ploc">${esc(locName(m.link))}</span>${m.sides.map(mon).join("")}</article>`;
  const team = ms.filter(m => m.sec === "team"), boxed = ms.filter(m => m.sec === "boxed");
  el.innerHTML = (team.length ? `<div class="pairs">${team.map(card).join("")}</div>` : `<p class="empty-list">${t().teamEmpty}</p>`)
    + (boxed.length ? `<div class="sec" style="margin-top:20px"><h3><span>${t().boxed}</span><em>${boxed.length}</em><small>${t().hint.boxed}</small></h3></div><div class="pairs">${boxed.map(card).join("")}</div>` : "");
}
const tyChip = ty => `<span class="ty" style="--tc:${TCOL[ty]}">${esc(typeName(ty))}</span>`;
function hpLine(b) {
  const r = b.max_hp ? b.hp / b.max_hp : 0;
  return `<div class="hpl"><span class="bar"><i style="--w:${(r * 100).toFixed(1)}%;--hc:var(--${r < .35 ? "danger" : r < .6 ? "warn" : "ok"})"></i></span>${b.hp}/${b.max_hp}</div>`;
}

// A finished entrance animation keeps an opacity layer around, and glass
// inside it then stops blurring the scene: drop it once it has played.
document.addEventListener("animationend", e => {
  const n = e.animationName;
  if ((n === "rise" || n === "fade") && e.target.style && !e.target.classList.contains("row") && !e.target.classList.contains("tile")) e.target.style.animation = "none";
});
// The night behind the client: parallax layers and drifting embers.
function scene() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const layers = [...document.querySelectorAll("#bgsvg .px")];
  if (!reduce) addEventListener("pointermove", e => {
    const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    layers.forEach(l => { const d = +l.dataset.d; l.style.transform = `translate(${-x * d}px,${-y * d * .5}px)`; });
  }, { passive: true });
  const cv = $("#embers"); if (!cv || reduce) return;
  const g = cv.getContext("2d"); let W, H;
  const size = () => { const r = devicePixelRatio || 1; W = cv.width = innerWidth * r; H = cv.height = innerHeight * r; cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px"; };
  size(); addEventListener("resize", size);
  const r = devicePixelRatio || 1;
  const mk = y => ({ x: Math.random() * W, y: y ?? H + 10, v: (.15 + Math.random() * .45) * r, s: (Math.random() < .7 ? 2 : 3) * r, c: Math.random() < .5 ? "255,141,77" : "86,194,240", a: .2 + Math.random() * .5, w: Math.random() * 6.28 });
  const P = Array.from({ length: 46 }, () => mk(Math.random() * H));
  const step = () => {
    if (!document.hidden) {
      g.clearRect(0, 0, W, H);
      for (const p of P) {
        p.y -= p.v; p.w += .01; p.x += Math.sin(p.w) * .25;
        if (p.y < -10) Object.assign(p, mk());
        const fade = Math.min(1, p.y / (H * .35));
        g.fillStyle = `rgba(${p.c},${p.a * fade})`; g.fillRect(p.x | 0, p.y | 0, p.s, p.s);
      }
    }
    requestAnimationFrame(step);
  };
  step();
  addEventListener("resize", () => movePill());
}

function render() {
  document.documentElement.lang = lang;
  if (!codeFromPath) return local ? renderSetup() : renderStart();
  if (!state) {
    $app.innerHTML = frame(`<p class="center-msg">${conn === "missing" ? t().missing : ""}</p>`);
    bindChrome(); updateStatus(); mounted = false; return;
  }
  if (!mounted) mount();
  updateStatus(); updatePlayers(); updateSetup(); updateLinks(); updateRail(); updateEncounters(); updateTeam(); updateTimeline(); updateTypes(); updateRules(); updateSettings(); updateCatch(); updateCard(); updateSidebar();
}

function apply(next) { state = next; conn = "live"; render(); }

function connect() {
  const code = codeFromPath;
  const path = `${SRV || location.origin}/api/runs/${encodeURIComponent(code.toUpperCase())}`;
  const ws = new WebSocket(path.replace(/^http/, "ws") + "/ws");
  let opened = false;
  ws.onopen = () => { opened = true; conn = "live"; updateStatus(); };
  ws.onmessage = m => { const msg = JSON.parse(m.data); if (msg.type === "state" && code === codeFromPath) apply(msg.state); };
  ws.onclose = async () => {
    if (code !== codeFromPath) return;
    if (!opened) {
      const r = await fetch(path).catch(() => null);
      if (r && r.status === 404) {
        // The app remembers a run its server no longer has: back to the setup.
        if (local) { setupUi.error = t().missing; await localPost("leave").catch(() => {}); local.code = null; codeFromPath = undefined; state = null; mounted = false; render(); return; }
        conn = "missing"; render(); return;
      }
    }
    conn = "offline"; updateStatus(); setTimeout(connect, 2000);
  };
}

async function boot() {
  if (!DEMO) {
    try {
      const r = await fetch("/api/local/state");
      if (r.ok) local = await r.json();
    } catch {}
  }
  if (local) {
    SRV = local.server || ""; codeFromPath = local.code || undefined;
    setInterval(async () => {
      try { const r = await fetch("/api/local/state"); if (r.ok) { local = await r.json(); showUpdate(); updateSidebar(); if (state && mounted) { updateSettings(); updateActions(); } } } catch {}
    }, 3000);
  }
  render();
  if (codeFromPath) enter();
}

// Starts everything a run page needs once its code is known.
function enter() {
  if (!sprites) fetch(SRV + "/api/config").then(r => r.json()).then(c => { sprites = c.sprites || null; if (state) { mounted = false; render(); } }).catch(() => {});
  if (!DEMO) connect();
  if (!enter.timer) enter.timer = setInterval(() => { if (state && mounted) { updatePlayers(); tick(); } }, 10000);
}

scene();
boot();
if (DEMO) {
  const run = () => window.SoulSyncDemo(apply);
  if (window.SoulSyncDemo) run();
  else { const s = document.createElement("script"); s.src = "/assets/demo.js"; s.onload = run; document.head.appendChild(s); }
}
</script>
</body>
</html>
