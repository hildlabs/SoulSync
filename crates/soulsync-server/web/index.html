<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoulSync</title>
<style>
/* Dark scoreboard that sits next to the emulator. System fonts only, so the
   page loads nothing from third parties. */
:root{
  color-scheme:dark;
  --ink:#0d0e11; --slab:#15171b; --slab2:#1c1f25; --rule:#2a2d35;
  --fg:#ecebe6; --dim:#8a8e98; --faint:#4b4f59;
  --p0:#ff5a36; --p1:#2fc6b4; --gold:#f2c14e; --bad:#ff3b5c; --ok:#7bd88f;
  --badw:rgba(255,59,92,.12); --goldw:rgba(242,193,78,.12);
  --disp:"Bahnschrift","DIN Alternate","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--fg)}
body{font:14px/1.4 var(--body);min-height:100vh;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
h1,h2{margin:0;font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.lab{font:10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--rule);background:var(--slab);padding:7px 14px;font:12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--fg)}
.btn.go{background:var(--gold);border-color:var(--gold);color:var(--ink)}
code{font:12.5px var(--mono);background:var(--slab2);padding:2px 6px;overflow-wrap:anywhere}

.app{max-width:1920px;margin:0 auto;display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.app>*{background:var(--ink);min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;padding:10px 16px}
.logo{font-size:28px;display:flex;align-items:center;gap:10px}
.logo i{width:13px;height:13px;background:var(--p0);transform:skewX(-14deg)}
.logo i+i{background:var(--p1);margin-left:-6px}
.code{display:flex;border:1px solid var(--rule)}
.code>*{padding:5px 10px;display:flex;align-items:center}
.code b{font:600 16px var(--mono);letter-spacing:.08em;color:var(--gold);border-left:1px solid var(--rule)}
.code button{border:0;border-left:1px solid var(--rule);background:transparent;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.code button:hover{color:var(--fg);background:var(--slab)}
.sp{flex:1}
.lang{display:flex;border:1px solid var(--rule)}
.lang button{border:0;background:transparent;padding:5px 10px;font:11px var(--mono);color:var(--dim)}
.lang button+button{border-left:1px solid var(--rule)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.conn{display:flex;align-items:center;gap:7px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.conn i{width:8px;height:8px;background:var(--faint)}
.conn.live i{background:var(--ok)} .conn.err{color:var(--bad)} .conn.err i{background:var(--bad)}

.board{display:grid;grid-template-columns:340px minmax(0,1fr) 380px;gap:1px;background:var(--rule);min-height:calc(100vh - 90px)}
.board>*{background:var(--ink);min-width:0}
.col{display:flex;flex-direction:column;gap:1px;background:var(--rule)}
.col>*{background:var(--ink)}
.col>.grow{flex:1}
.cell{padding:14px 16px}
.cell-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.cell-h h2{font-size:20px}

.player{position:relative;display:grid;gap:10px}
.player::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.player h2{font-size:24px;color:var(--c)}
.pstat{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.dot{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.dot i{width:7px;height:7px;background:var(--faint)} .dot.on{color:var(--ok)} .dot.on i{background:var(--ok)}
.badges{display:flex;gap:3px}
.badges i{width:14px;height:14px;border:1px solid var(--faint);transform:rotate(45deg) scale(.7)}
.badges i.on{background:var(--c);border-color:var(--c)}
.mon{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--slab2)}
.mon b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon small{color:var(--dim)}
.mon .lv{font:13px var(--mono)}
.hp{grid-column:1/-1;height:4px;background:var(--slab2)}
.hp i{display:block;height:100%;background:var(--ok)}
.hp.mid i{background:var(--gold)} .hp.low i{background:var(--bad)}
.empty{color:var(--dim);font-size:13px;padding:6px 0}

.links{width:100%;border-collapse:collapse}
.links th{font:10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:400;text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule)}
.links td{padding:8px 12px;border-bottom:1px solid var(--slab2);vertical-align:middle}
.links tr.dead td{background:var(--badw)}
.links tr.wait td{background:var(--goldw)}
.side b{font-weight:600}
.side small{display:block;color:var(--dim);font-size:12px}
.side.fainted b{text-decoration:line-through;text-decoration-color:var(--bad)}
.chip{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)} .chip.wait{color:var(--gold)}
.wrapx{overflow-x:auto}

.log{display:grid}
.ev{display:grid;grid-template-columns:44px 4px minmax(0,1fr);gap:10px;padding:8px 16px;border-top:1px solid var(--slab2);font-size:13.5px}
.ev time{font:11.5px var(--mono);color:var(--dim);padding-top:2px}
.ev>i{background:var(--c)}
.ev.bad{background:var(--badw)}

.landing{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--rule)}
.landing>*{background:var(--ink);padding:24px}
.landing h2{font-size:26px;margin-bottom:12px}
.landing p{color:var(--dim);max-width:60ch;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:0;background:var(--slab);border:1px solid var(--rule);padding:7px 10px;font-family:var(--mono);text-transform:uppercase}
.steps{margin:14px 0 0;padding-left:18px;display:grid;gap:8px;color:var(--dim)}
.steps li span{color:var(--fg)}

@media (max-width:1300px){.board{grid-template-columns:300px minmax(0,1fr)}.board>.logcol{grid-column:1/-1}}
@media (max-width:800px){.board{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
"use strict";
const T = {
  en: {
    tagline: "Track Pokémon Soul Link runs live, straight from your emulator.",
    newRun: "New run", create: "Create run", newRunText: "Creates a run and a code for you and your partner.",
    join: "Open a run", joinText: "Already have a code? Open the run's dashboard.", open: "Open",
    codePh: "e.g. ZORUA-4821", copy: "Copy", copied: "Copied",
    stepsTitle: "Then, on both computers:",
    step1: "Start the game in DeSmuME and save once.",
    step2: "Run", step3: "Every in-game save updates this dashboard.",
    live: "Live", offline: "Reconnecting", notFound: "Run not found",
    online: "Online", away: "Offline", badges: "badges", party: "Party", synced: "synced",
    never: "no save yet", links: "Soul Links", location: "Location", status: "Status",
    linked: "Linked", waiting: "Waiting", dead: "Dead", noLinks: "No Pokémon yet. Sync a save to see the links.",
    events: "Events", noEvents: "Nothing yet. Events appear when a player saves.",
    waitingFor: "Waiting for players", waitingText: "Share the code. Each player runs:",
    yourSave: "<save>", yourName: "<your name>",
    caught: "caught", fainted: "fainted", evolved: "evolved into", lv: "reached Lv",
    toParty: "joined the party", toBox: "went to box", gone: "is gone", gotBadge: "now has badges:",
    lvShort: "Lv", hp: "HP", box: "Box", met: "met at", ago: s => s < 60 ? "just now" : s < 3600 ? `${Math.floor(s/60)} min ago` : `${Math.floor(s/3600)} h ago`,
  },
  de: {
    tagline: "Soul-Link-Runs live verfolgen, direkt aus dem Emulator.",
    newRun: "Neuer Run", create: "Run erstellen", newRunText: "Erstellt einen Run und einen Code für dich und deinen Partner.",
    join: "Run öffnen", joinText: "Du hast schon einen Code? Öffne das Dashboard des Runs.", open: "Öffnen",
    codePh: "z. B. ZORUA-4821", copy: "Kopieren", copied: "Kopiert",
    stepsTitle: "Danach auf beiden Rechnern:",
    step1: "Spiel in DeSmuME starten und einmal speichern.",
    step2: "Ausführen", step3: "Jedes Speichern im Spiel aktualisiert dieses Dashboard.",
    live: "Live", offline: "Verbinde neu", notFound: "Run nicht gefunden",
    online: "Online", away: "Offline", badges: "Orden", party: "Team", synced: "synchronisiert",
    never: "noch kein Spielstand", links: "Soul Links", location: "Ort", status: "Status",
    linked: "Verlinkt", waiting: "Wartet", dead: "Tot", noLinks: "Noch keine Pokémon. Synchronisiere einen Spielstand, um die Links zu sehen.",
    events: "Ereignisse", noEvents: "Noch nichts. Ereignisse erscheinen, wenn jemand speichert.",
    waitingFor: "Warte auf Spieler", waitingText: "Teile den Code. Jeder Spieler startet:",
    yourSave: "<spielstand>", yourName: "<dein Name>",
    caught: "hat gefangen:", fainted: "ist besiegt", evolved: "hat sich entwickelt zu", lv: "ist jetzt Lv",
    toParty: "ist jetzt im Team", toBox: "liegt jetzt in Box", gone: "ist weg", gotBadge: "hat jetzt Orden:",
    lvShort: "Lv", hp: "KP", box: "Box", met: "gefangen in", ago: s => s < 60 ? "gerade eben" : s < 3600 ? `vor ${Math.floor(s/60)} Min.` : `vor ${Math.floor(s/3600)} Std.`,
  },
};

const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let lang = store.get("soulsync.lang") || (navigator.language || "en").slice(0,2);
if (!T[lang]) lang = "en";
const t = () => T[lang];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $app = document.getElementById("app");
const origin = location.origin;
const codeFromPath = (location.pathname.match(/^\/run\/([^/]+)/) || [])[1];

let state = null, connState = "offline";

function nameOf(names, fallback){ return names ? names[lang] : fallback; }
function species(p){ return nameOf(p.species_name, "#" + p.species); }
function label(p){ return p.is_nicknamed && p.nickname ? p.nickname : species(p); }
function locName(id, names){ return nameOf(names, "#" + id); }

function header(){
  const code = state ? state.code : codeFromPath;
  return `<header class="head">
    <h1 class="logo"><i></i><i></i><a href="/" style="color:inherit;text-decoration:none">SoulSync</a></h1>
    ${code ? `<div class="code"><span class="lab">Run</span><b id="code">${esc(code.toUpperCase())}</b><button type="button" id="copy">${t().copy}</button></div>` : ""}
    ${code ? `<span class="conn ${connState === "live" ? "live" : connState === "missing" ? "err" : ""}"><i></i>${connState === "live" ? t().live : connState === "missing" ? t().notFound : t().offline}</span>` : ""}
    <span class="sp"></span>
    <div class="lang" id="lang"><button type="button" data-l="en" aria-pressed="${lang==="en"}">EN</button><button type="button" data-l="de" aria-pressed="${lang==="de"}">DE</button></div>
  </header>`;
}

function syncCmd(code){
  const server = origin.startsWith("http://localhost:3000") ? "" : ` --server ${origin}`;
  return `soulsync sync ${t().yourSave} --code ${code} --name ${t().yourName}${server}`;
}

function landing(){
  return header() + `<div class="landing">
    <section>
      <h2>${t().newRun}</h2>
      <p>${t().newRunText}</p>
      <button class="btn go" type="button" id="create">${t().create}</button>
      <div id="created"></div>
    </section>
    <section>
      <h2>${t().join}</h2>
      <p>${t().joinText}</p>
      <form class="row" id="joinForm"><label class="lab" for="joinCode" hidden>Code</label><input id="joinCode" autocomplete="off" placeholder="${t().codePh}" required><button class="btn" type="submit">${t().open}</button></form>
    </section>
  </div>`;
}

function stepsHtml(code){
  return `<ol class="steps"><li>${t().step1}</li><li>${t().step2}: <code>${esc(syncCmd(code))}</code></li><li>${t().step3}</li></ol>`;
}

function playerCard(p, i){
  const snap = p.snapshot;
  const badges = snap ? snap.trainer.badges : 0;
  const party = snap ? snap.party.filter(m => !m.is_egg) : [];
  const ago = p.updated_at ? t().ago(Math.max(0, (Date.now() - p.updated_at) / 1000)) : t().never;
  return `<section class="cell player" style="--c:var(--p${i})">
    <h2>${esc(p.name)}</h2>
    <div class="pstat"><span class="dot ${p.connected ? "on" : ""}"><i></i>${p.connected ? t().online : t().away}</span><span class="lab">${p.updated_at ? t().synced + " " : ""}${esc(ago)}</span></div>
    <div class="pstat"><span class="badges">${Array.from({length:8}, (_, k) => `<i class="${k < badges ? "on" : ""}"></i>`).join("")}</span><span class="lab">${badges} ${t().badges}</span></div>
    <div><div class="lab">${t().party} (${party.length})</div>
      ${party.map(m => { const b = m.battle || {hp:0,max_hp:1,level:0}; const r = b.max_hp ? b.hp / b.max_hp : 0;
        return `<div class="mon"><b>${esc(label(m))}${m.is_nicknamed ? ` <small>${esc(species(m))}</small>` : ""}</b><span class="lv">${t().lvShort} ${b.level}</span>
          <div class="hp ${r < .25 ? "low" : r < .5 ? "mid" : ""}"><i style="width:${Math.round(r*100)}%"></i></div></div>`; }).join("") || `<div class="empty">${t().never}</div>`}
    </div>
  </section>`;
}

function sideHtml(s){
  if (!s) return `<span class="lab">–</span>`;
  const p = s.pokemon, b = p.battle;
  const where = s.status === "boxed" ? `${t().box}` : b ? `${t().lvShort} ${b.level} · ${t().hp} ${b.hp}/${b.max_hp}` : "";
  return `<div class="side ${s.status}"><b>${esc(label(p))}</b><small>${esc(p.is_nicknamed ? species(p) + " · " : "")}${esc(where)}</small></div>`;
}

function linksHtml(){
  const ps = state.players;
  if (!state.links.length) return `<p class="empty">${t().noLinks}</p>`;
  return `<div class="wrapx"><table class="links"><thead><tr><th>${t().location}</th>${ps.map((p,i) => `<th style="color:var(--p${i})">${esc(p.name)}</th>`).join("")}${ps.length < 2 ? "<th>–</th>" : ""}<th>${t().status}</th></tr></thead><tbody>
    ${state.links.map(l => {
      const dead = l.sides.some(s => s && s.status === "fainted");
      const complete = l.sides.length >= 2 && l.sides.every(Boolean);
      const cls = dead ? "dead" : complete ? "" : "wait";
      const chip = dead ? `<span class="chip bad">${t().dead}</span>` : complete ? `<span class="chip ok">${t().linked}</span>` : `<span class="chip wait">${t().waiting}</span>`;
      const sides = [...l.sides]; while (sides.length < 2) sides.push(null);
      return `<tr class="${cls}"><td>${esc(locName(l.location, l.location_name))}</td>${sides.map(sideHtml).map(h => `<td>${h}</td>`).join("")}<td>${chip}</td></tr>`;
    }).join("")}
  </tbody></table></div>`;
}

function eventText(e){
  const x = t();
  switch (e.type) {
    case "caught": return `${x.caught} <b>${esc(label(e.pokemon))}</b> (${x.met} ${esc(locName(e.pokemon.met_location, e.pokemon.met_location_name))})`;
    case "fainted": return `<b>${esc(label(e.pokemon))}</b> ${x.fainted}`;
    case "evolved": return `<b>${esc(label(e.pokemon))}</b> ${x.evolved} ${esc(species(e.pokemon))}`;
    case "level_up": return `<b>${esc(label(e.pokemon))}</b> ${x.lv} ${e.pokemon.battle ? e.pokemon.battle.level : "?"}`;
    case "moved": return `<b>${esc(label(e.pokemon))}</b> ${e.pokemon.place.kind === "party" ? x.toParty : `${x.toBox} ${e.pokemon.place.box}`}`;
    case "gone": return `<b>${esc(label(e.pokemon))}</b> ${x.gone}`;
    case "badges": return `${x.gotBadge} ${e.count}`;
    default: return esc(e.type);
  }
}

function logHtml(){
  if (!state.log.length) return `<p class="empty" style="padding:0 16px">${t().noEvents}</p>`;
  const idx = Object.fromEntries(state.players.map((p,i) => [p.name, i]));
  return `<div class="log">${state.log.map(l => {
    const d = new Date(l.at), hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
    return `<div class="ev ${l.event.type === "fainted" ? "bad" : ""}" style="--c:var(--p${idx[l.player] ?? 0})"><time>${hh}:${mm}</time><i></i><div><span class="lab" style="color:var(--p${idx[l.player] ?? 0})">${esc(l.player)}</span> ${eventText(l.event)}</div></div>`;
  }).join("")}</div>`;
}

function runView(){
  if (!state) return header() + `<section class="cell"><p class="empty">${connState === "missing" ? t().notFound : "…"}</p></section>`;
  const players = state.players;
  return header() + `<div class="board">
    <div class="col">
      ${players.map(playerCard).join("")}
      ${players.length < 2 ? `<section class="cell grow"><div class="cell-h"><h2>${t().waitingFor}</h2></div><p class="empty">${t().waitingText}</p>${stepsHtml(state.code)}</section>` : `<div class="grow"></div>`}
    </div>
    <section class="cell"><div class="cell-h"><h2>${t().links}</h2><span class="lab n">${state.links.length}</span></div>${linksHtml()}</section>
    <div class="col logcol"><section class="grow"><div class="cell"><div class="cell-h" style="margin:0"><h2>${t().events}</h2></div></div>${logHtml()}</section></div>
  </div>`;
}

function render(){
  document.documentElement.lang = lang;
  $app.innerHTML = codeFromPath ? runView() : landing();
  bind();
}

function bind(){
  const langEl = document.getElementById("lang");
  if (langEl) langEl.onclick = e => { const b = e.target.closest("button"); if (!b) return; lang = b.dataset.l; store.set("soulsync.lang", lang); render(); };
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = async () => {
    const text = document.getElementById("code").textContent;
    try { await navigator.clipboard.writeText(text); copy.textContent = t().copied; setTimeout(() => copy.textContent = t().copy, 1500); }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
  const create = document.getElementById("create");
  if (create) create.onclick = async () => {
    create.disabled = true;
    try {
      const res = await fetch("/api/runs", { method: "POST" });
      const run = await res.json();
      location.href = "/run/" + encodeURIComponent(run.code);
    } catch (e) { create.disabled = false; document.getElementById("created").textContent = String(e); }
  };
  const form = document.getElementById("joinForm");
  if (form) form.onsubmit = e => { e.preventDefault(); const c = document.getElementById("joinCode").value.trim().toUpperCase(); if (c) location.href = "/run/" + encodeURIComponent(c); };
}

function connect(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/api/runs/${encodeURIComponent(codeFromPath.toUpperCase())}/ws`);
  let opened = false;
  ws.onopen = () => { opened = true; connState = "live"; render(); };
  ws.onmessage = m => {
    const msg = JSON.parse(m.data);
    if (msg.type === "state") { state = msg.state; render(); }
  };
  ws.onclose = async () => {
    if (!opened) {
      const r = await fetch(`/api/runs/${encodeURIComponent(codeFromPath.toUpperCase())}`).catch(() => null);
      if (r && r.status === 404) { connState = "missing"; render(); return; }
    }
    connState = "offline"; render(); setTimeout(connect, 2000);
  };
}

render();
if (codeFromPath) { connect(); setInterval(() => { if (state) render(); }, 30000); }
</script>
</body>
</html>
